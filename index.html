<title>Skat-LOGGER</title>
<style>
:root{--c1:#2a78d6;--c2:#eb6834;--c3:#1baf7a;--c4:#eda100;--c5:#e87ba4;--c6:#008300;--c7:#6250d6;--c8:#e34948;--pl1:#184f95;--pl2:#2a78d6;--pl3:#6da7ec;--pl4:#b7d3f6;--grid:#e1e0d9;--zebra:#e6e1d2;--sec:#d3dccf;--bg:#f4f1ea;--card:#fff;--ink:#1d2a24;--mute:#6b766f;--line:#ddd8cb;--accent:#1f6b4a;--accent-ink:#fff;--bad:#b3322b;--good:#1f6b4a;--warn:#b7791f;--chip:#ece8dc}
@media (prefers-color-scheme:dark){:root{--c1:#3987e5;--c2:#d95926;--c3:#199e70;--c4:#c98500;--c5:#d55181;--c6:#008300;--c7:#9085e9;--c8:#e66767;--pl1:#b7d3f6;--pl2:#6da7ec;--pl3:#2a78d6;--pl4:#184f95;--grid:#2c2c2a;--zebra:#26392f;--sec:#34513f;--bg:#14201a;--card:#1d2d25;--ink:#e8efe9;--mute:#9aaba1;--line:#2f4439;--accent:#3fae7c;--accent-ink:#062014;--bad:#ef7b72;--good:#5fd09b;--warn:#e3b04f;--chip:#27392f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,Segoe UI,sans-serif;padding-bottom:90px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
h1{font-size:20px;margin:16px 0}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 16px;font-weight:600}

input[type=text],input[type=number],select{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}

.pl{display:grid;gap:8px}
.p{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;min-width:0}
.p.deal{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}

/* Diagramme der Statistik */
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px;margin-top:10px}

.chartcard.wide{grid-column:1/-1}

.legend span.it{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;flex:none}

.donut path:hover,.hb i:hover{opacity:.8}

.hrow{display:grid;grid-template-columns:78px 1fr;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.hrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.hb i{display:block;min-width:0;border-radius:0 4px 4px 0;height:100%}
.hb i:first-child{border-radius:0 4px 4px 0}
.hv{font-size:12px;color:var(--mute);margin-top:1px}
.linechart{display:block;width:100%;height:auto}
.linechart text{fill:var(--mute);font-size:11px;font-family:inherit}
.dsk{display:contents}
.menu-btn,.rn{display:none}
.selrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:8px}
.selrow select{margin-bottom:8px}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu-item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 12px;min-height:56px;font-size:16px;font-weight:600;text-align:left}
.menu-item span{font-size:22px}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.sheet{padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.appt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}.appt.past{opacity:.75}.appt .at{font-size:17px;font-weight:700;margin:2px 0}.appt .arow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.appt .arow .btn{padding:8px 10px}
.chip.hol{background:#f3d3d0;color:#8a1f18}
textarea,input[type=time]{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;font:inherit}
.datelab{align-self:center;font-weight:600}
.cal{margin:8px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px}.calnav{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-bottom:6px}.calnav .btn{padding:4px 12px;min-width:40px}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.calgrid .cw{text-align:center;font-size:12px;color:var(--mute);font-weight:700}.calgrid .cw.sat{color:var(--c1)}.calgrid .cw.sun{color:var(--bad)}
.cd{aspect-ratio:1/1;min-height:36px;border:1px solid transparent;border-radius:8px;background:var(--chip);color:var(--ink);font-weight:600;position:relative;padding:0}.cd.empty{background:none}
.cd.sat{background:#cfe0f7;color:#12457f}.cd.sun,.cd.hol{background:#f3c9c5;color:#8a1f18}.cd.hol.reg{background:#f8e0dd}
.cd.today{border-color:var(--ink)}.cd.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}.cd.has::after{content:'';position:absolute;bottom:3px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.callegend{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mute);margin-top:6px}.callegend .btn{padding:4px 10px;margin-left:auto}.lg{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px}.lg.sat{background:#cfe0f7}.lg.sun,.lg.hol{background:#f3c9c5}.lg.has{background:var(--warn);border-radius:50%}
.calhol{margin-top:4px}.whobox{display:flex;flex-wrap:wrap;gap:2px 14px}
.logrow{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--c1);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:14px}.logrow.verschoben{border-left-color:var(--c2)}.logrow.gelöscht{border-left-color:var(--bad)}.logrow.geändert{border-left-color:var(--c4)}.logrow .chg{margin-top:2px}
.wapre{white-space:pre-wrap;background:var(--chip);padding:10px;border-radius:8px;font-family:inherit;font-size:13px;line-height:1.4;margin:4px 0}
.nextappt{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px;cursor:pointer;font-size:14px}
@media (prefers-color-scheme:dark){.chip.hol{background:#5a2724;color:#ffd5d1}.cd.sat{background:#27425f;color:#bcd8fb}.cd.sun,.cd.hol{background:#5d2c29;color:#ffd5d1}.cd.hol.reg{background:#442523}}
.home{max-width:520px;margin:0 auto;padding:8px 0 24px}.homelogo{display:flex;justify-content:center;cursor:pointer;margin:6px 0 8px}.homelogo svg{width:min(240px,60vw,36vh);height:auto}.hometitle{text-align:center;margin:0 0 2px}.homemain{margin-bottom:10px}.homemain .menu-item{width:100%;justify-content:center;font-size:18px;min-height:64px}.menu-item.prim{background:var(--accent,#17382a);color:#fff;border-color:transparent}.homebar{margin-top:12px}
.mlabel{font-size:10px}
/* Handy und kleine Tablets: Menü statt vieler Knöpfe, Spielzeilen als Karten mit Zahlenreihe */
@media(max-width:900px){
  #app tr.h1 th.pc{min-width:0!important}
  .wrap{padding:0 10px}
  .dsk{display:none}
  .menu-btn{display:inline-block}
  .top{padding:6px 0}
  .top .banner{font-size:13px;padding:6px 10px;margin:4px 0 0}
  .card{padding:6px;margin:8px 0}
  table.gt,table.gt thead,table.gt tbody{display:block}
  table.gt{font-size:13px}
  table.gt thead{position:sticky;top:var(--topH,0px);z-index:4;background:var(--card)}
  table.gt tr{display:grid;grid-template-columns:repeat(var(--np),minmax(0,1fr)) 68px}
  table.gt tr.h1 th:nth-child(-n+2),table.gt tr.h2 th:nth-child(-n+2){display:none}
  table.gt tr.h1 th,table.gt tr.h2 th{position:static;padding:4px 2px;overflow:hidden}
  table.gt tr.h2 th{font-size:17px}

<body>
<div class="wrap" id="app"></div>
<div id="modal"></div>
<script>
/* ---------- Daten ---------- */
const TYPES={karo:{n:'Karo',b:9},herz:{n:'Herz',b:10},pik:{n:'Pik',b:11},kreuz:{n:'Kreuz',b:12},grand:{n:'Grand',b:24},null:{n:'Null'},ramsch:{n:'Ramsch'}};
const groupOf=t=>t==='grand'?'grand':t==='ramsch'?'ramsch':['karo','herz','pik','kreuz'].includes(t)?'farbe':null;
const GROUPN={grand:'Grand',ramsch:'Ramsch',farbe:'Farbspiel'};
const LEVELN=['','Bock','Hirsch','Geweih'];
const OUTN={W:'Gewonnen',WS:'Gewonnen, Schneider',WSW:'Gewonnen, Schwarz',L:'Verloren',LS:'Verloren, Schneider',LSW:'Verloren, Schwarz'};
const REIZ=(()=>{const s=new Set([23,35,46,59]);[9,10,11,12,24].forEach(b=>{for(let k=2;k<=13;k++)s.add(b*k)});return [...s].filter(v=>v>=18&&v<=264).sort((a,b)=>a-b)})();
const DEF={bock:2,hirsch:4,geweih:8,lossFactor:2,contraPays:true,startBock:true,malenko:true,durchmarsch:'andere',jungfrau:2,round10:true,spitze:false};
const FIX={bock:2,hirsch:4,geweih:8,lossFactor:2,jungfrau:2,durchmarsch:'andere'}; // feste Faktoren, nicht einstellbar
const r10=v=>Math.round(v/10)*10;
const KEY='skat-schreiber-v1';
const NAMES=['Guido','Karsten','Martin','Peter']; // Auswahlmenü für Namen, weitere Namen sind frei eingebbar
let S=load()||{started:false,n:4,players:[...NAMES],startDealer:0,hands:[],events:[],settings:{...DEF}};
S.nameList=S.nameList||[...NAMES];
S.settings={...DEF,...S.settings,...FIX};
S.events=S.events||[];
const padPlayers=()=>{for(let i=S.players.length;i<4;i++)S.players.push(NAMES[i])};
padPlayers();
let F=null,editIdx=null;

function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch(e){return null}}
// Rückgängig: jede gespeicherte Änderung merkt sich den vorherigen Stand
let lastSnap=null,undoStack=[];
function save(){
  const cur=JSON.stringify(S);
  if(lastSnap!==null&&cur!==lastSnap){undoStack.push(lastSnap);if(undoStack.length>80)undoStack.shift()}
  lastSnap=cur;
  try{localStorage.setItem(KEY,cur)}catch(e){}
}
function undo(){
  if(!undoStack.length)return;
  const prev=undoStack.pop();
  S=JSON.parse(prev);
  S.settings={...DEF,...S.settings,...FIX};S.events=S.events||[];S.days=S.days||[];S.stake=S.stake||{base:25,per100:0.5};
  S.season=S.season||{id:1,name:'Saison 1',start:new Date().toISOString()};S.pastSeasons=S.pastSeasons||[];S.nameList=S.nameList||[...NAMES];
  apptEnsure();lastSnap=prev;
  try{localStorage.setItem(KEY,prev)}catch(e){}
  closeModal();render();
}
const undoBtn=()=>`<button class="btn sec" ${undoStack.length?'':'disabled'} onclick="undo()" title="Letzte Änderung zurücknehmen">↶ Rückgängig${undoStack.length?' ('+undoStack.length+')':''}</button>`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=i=>esc(S.players[i]||('Spieler '+(i+1)));
const nextSeat=(seat,from)=>{const x=seat.find(v=>v>from);return x===undefined?seat[0]:x};
const levelF=lv=>lv>0?S.settings.bock:1;
const STAGEN=['','Kontra','Re','Hirsch','Geweih'];
const STAGEF=[1,2,4,8,16];
const stageOf=h=>{if(!h.contra||!h.contra.length)return 0;return h.stage!=null?h.stage:(h.re?2:1)};

/* ---------- Berechnung ---------- */
function calc(h,level,active,seat){
  seat=seat||active;
  const st=S.settings,lf=levelF(level),pts={};
  if(h.type==='ramsch'&&h.open)return {kind:'ramsch',open:true,value:null,won:null,pts,text:'Ramsch läuft – Augen folgen',contraWon:false,mult:null};
  if(h.type==='ramsch'){
    const a=h.augen||{};
    let text='',jf=false,rvOut=null;
    if(h.durchmarsch!=null&&h.durchmarsch!==''){
      const m=+h.durchmarsch;
      if(st.durchmarsch==='gut'){pts[m]=-120*lf;text=S.players[m]+' Durchmarsch (−120)'}
      else{active.filter(i=>i!==m).forEach(i=>pts[i]=120*lf);text=S.players[m]+' Durchmarsch (andere je 120)'}
    }else{
      const vals=active.map(i=>+a[i]||0),mx=Math.max(...vals);
      const rv=st.round10?r10(mx):mx;
      // Jungfrau (×2) nur, wenn sie angesagt/gewählt wurde; möglich ist das nur, wenn ein Spieler 0 Augen hat
      jf=!!h.jungfrau&&active.some(i=>(+a[i]||0)===0);
      const jfF=jf?st.jungfrau:1;
      active.forEach(i=>{if((+a[i]||0)===mx)pts[i]=rv*jfF*lf});
      text='Verlierer: '+active.filter(i=>(+a[i]||0)===mx).map(i=>S.players[i]).join(', ')+' ('+mx+' Augen'+(rv!==mx?' → '+rv:'')+(jf?' × Jungfrau '+st.jungfrau:'')+')';
      rvOut=rv;
    }
    return {kind:'ramsch',value:null,won:null,pts,text,contraWon:false,mult:null,jf,rv:rvOut,lf};
  }
  const t=TYPES[h.type];let base,mult=null,value;
  let won=h.outcome[0]==='W';
  if(h.type==='null'){
    base=h.ouvert&&h.hand?59:h.ouvert?46:h.hand?35:23;value=base;
  }else{
    base=t.b*(h.spitze&&st.spitze?2:1); // Spitze: umgekehrte Rangfolge, Sieben Trumpf -> Wert verdoppelt
    const stage=h.outcome.endsWith('SW')?2:h.outcome.endsWith('S')?1:0;
    const fo=h.ouvert&&!h.ouvertFree; // alte Spiele: Ouvert schließt Hand/Schneider/Schwarz automatisch ein
    const hand=h.hand||fo,swA=h.schwarzAng||fo,snA=h.schnAng||swA;
    if(snA&&!(won&&stage>=1))won=false;
    if(swA&&!(won&&stage===2))won=false;
    mult=h.n+1+(hand?1:0)+(stage>=1?1:0)+(stage===2?1:0)+(snA?1:0)+(swA?1:0)+(h.ouvert?1:0);
    value=base*mult;
  }
  let over=false;
  if(h.reiz&&value<h.reiz&&h.type!=='null'){over=true;won=false;value=base*Math.ceil(h.reiz/base)}
  else if(h.reiz&&value<h.reiz){over=true;won=false}
  const cf=STAGEF[stageOf(h)]*lf;
  if(h.open)return {kind:'game',open:true,value,won:null,over:false,mult,pts,contraWon:false,newRound:false,base,cf};
  const contraWon=!won&&h.contra&&h.contra.length>0;
  const sixty=!won&&h.type!=='null'&&h.augenSp!==''&&h.augenSp!=null&&+h.augenSp===60; // mit genau 60 Augen verloren (ohne Kontra)
  if(!won)pts[h.declarer]=value*st.lossFactor*cf;
  else if(st.contraPays)seat.forEach(i=>{if(i!==h.declarer)pts[i]=value*cf}); // Gewonnen: alle anderen Mitspieler (auch der aussetzende Geber) bekommen den Wert
  return {kind:'game',value,won,over,mult,pts,contraWon,sixty,newRound:!!(contraWon||sixty),base,cf};
}

function replay(){
  // Eine Bock-/Ramschrunde = N Bock-Spiele (×Bock) + N Ramsch-Spiele. Runden laufen nacheinander.
  // Mitspieler können kommen (Start = Schnitt der Aktiven, ganz rechts) oder gehen (Ende: Schnitt der Folgepunkte kommt dazu)
  const L=S.players.length;
  let seat=[...Array(Math.min(S.n,L)).keys()],N=seat.length;
  // Eine Bock-/Ramschrunde = N Bock-Spiele + N Ramsch-Spiele. Der Spieltag beginnt mit N solchen Runden (N = Spieleranzahl).
  let rounds=S.settings.startBock?N:0,pos=0,dealer=null;
  let done=Array.from({length:L},()=>new Set()),ptr=null,ramschLeft=0;
  const rows=[],totals=Array(L).fill(0),info=Array.from({length:L},()=>({}));
  const applied=new Set();
  // Einstieg erst, wenn keine Bock-/Ramschrunde und keine Malenko-Runde angefangen ist
  const boundaryOk=()=>(rounds===0||pos===0)&&ramschLeft===0&&done.every(s=>s.size===0);
  const applyEvents=at=>{
    (S.events||[]).filter(e=>!applied.has(e)&&e.at<=at).forEach(e=>{
      if(e.type==='join'&&!seat.includes(e.p)){
        if(!boundaryOk())return;
        applied.add(e);
        const avg=seat.length?Math.round(seat.reduce((s,i)=>s+totals[i],0)/seat.length):0;
        totals[e.p]=avg;info[e.p]={joinAt:at,start:avg};seat=[...seat,e.p].sort((a,b)=>a-b);
      }else if(e.type==='leave'&&seat.includes(e.p)){
        applied.add(e);
        info[e.p]={...info[e.p],leaveAt:at,leaveTotal:totals[e.p],snap:totals.slice()};
        seat=seat.filter(x=>x!==e.p);
      }
    });
    N=seat.length;
  };
  const pickDealer=i=>{
    if(i===0){dealer=seat.includes(S.startDealer)?S.startDealer:seat[0];return}
    // ein neu eingestiegener Spieler gibt zuletzt (nie sofort als Erster): er wird beim Weiterreichen übersprungen
    let c=nextSeat(seat,dealer),g=0;
    while(info[c].joinAt===i&&g++<seat.length)c=nextSeat(seat,c);
    dealer=c;
  };
  S.hands.forEach((h,i)=>{
    applyEvents(i);pickDealer(i);
    const play=seat.length===4?seat.filter(x=>x!==dealer):seat.slice();
    const forced=ramschLeft;
    const inRamschSlot=rounds>0&&pos>=N;
    // Veto: Spieler spielt Grand Hand statt Ramsch, das Ramschspiel wird nicht verbraucht (ein weiteres kommt dazu)
    if(h.veto){if(h.passe)ramschLeft=N}
    else if(h.passe)ramschLeft=N-1;else if(ramschLeft>0&&!h.open)ramschLeft--;
    const auto=rounds>0&&pos<N?1:0;
    const isMalH=h.malPlayer!=null&&h.malPlayer!=='';
    const lv=isMalH?0:(h.levelOverride!=null&&h.levelOverride!==''?+h.levelOverride:auto); // im Malenko gibt es keinen Bock
    const c=calc(h,lv,play,seat);
    Object.entries(c.pts).forEach(([k,v])=>totals[+k]+=v);
    rows.push({h,i,lv,c,dealer,seat:seat.slice(),play,cum:totals.slice(),forced,slot:rounds>0?(pos<N?'bock':'ramsch'):'mal'});
    // ein noch laufendes Spiel (ohne Ergebnis) belegt seinen Platz in der Runde, die Runde ist erst mit dem Ergebnis weiter
    if(rounds>0&&!c.open&&!(h.veto&&inRamschSlot)){pos++;if(pos>=2*N){pos=0;rounds--}}
    if(c.newRound)rounds++;
    if(h.malPlayer!=null&&h.malPlayer!==''){
      done[+h.malPlayer].add(h.veto?'ramsch':groupOf(h.type));ptr=+h.malPlayer;
      // erst wenn das letzte Malenko-Spiel beendet ist (Ergebnis eingetragen), beginnt die nächste Malenko-Runde (alles wieder grün)
      if(seat.every(p=>done[p].size===3)&&!c.open)done=Array.from({length:L},()=>new Set());
    }
  });
  applyEvents(S.hands.length);
  // Solange das letzte Spiel läuft (Ergebnis offen), bleibt dessen Geber Geber; erst mit dem Ergebnis geht es zum nächsten Geber
  if(rows.length&&rows[rows.length-1].c.open&&rows[rows.length-1].i===S.hands.length-1)dealer=rows[rows.length-1].dealer;
  else pickDealer(S.hands.length);
  const play=seat.length===4?seat.filter(x=>x!==dealer):seat.slice();
  // Hochrechnung für ausgeschiedene Spieler: Schnitt der Punkte, die die Übrigen seitdem dazubekommen haben
  info.forEach((inf,p)=>{
    if(inf.leaveAt==null)return;
    const gains=seat.map(j=>totals[j]-((info[j].joinAt!=null&&info[j].joinAt>inf.leaveAt)?info[j].start:inf.snap[j]));
    inf.proj=gains.length?Math.round(gains.reduce((a,b)=>a+b,0)/gains.length):0;
  });
  const nextLevel=rounds>0&&pos<N?1:0;
  const slot=rounds>0?(pos<N?'bock':'ramsch'):'mal';
  const forcedRamsch=ramschLeft>0||slot==='ramsch';
  const forcedInfo=slot==='ramsch'?`Ramschrunde: Spiel ${pos-N+1} von ${N}`+(ramschLeft>0?` (alle gepasst: noch ${ramschLeft})`:''):ramschLeft>0?`alle haben gepasst: noch ${ramschLeft} Ramsch-Spiel(e)`:'';
  const d=dealer;
  let mal=null;
  if(!forcedRamsch&&rounds===0&&S.settings.malenko){
    let c=nextSeat(seat,ptr!=null?ptr:d);
    for(let k=0;k<seat.length;k++){
      if(!(seat.length===4&&c===d)&&done[c].size<3){
        mal={player:c,remaining:['grand','ramsch','farbe'].filter(g=>!done[c].has(g))};break}
      c=nextSeat(seat,c);
    }
  }
  const pending=(S.events||[]).filter(e=>e.type==='join'&&!applied.has(e)).map(e=>e.p);
  const lastOpen=S.hands.length>0&&!!S.hands[S.hands.length-1].open;
  const canChange=boundaryOk()&&!lastOpen; // solange ein Spiel läuft (Ergebnis offen) kein Wechsel; // Spielerwechsel nur zwischen Runden, nicht mitten in Bock-/Ramsch- oder Malenko-Runde
  return {canChange,rows,totals,rounds,pos,slot,nextLevel,dealer:d,mal,ramschLeft,forcedRamsch,forcedInfo,done,seat,play,N,info,pending};
}

/* ---------- Anzeige ---------- */
let HOME=true; // beim Start der App zuerst der Startbildschirm
function goHome(){closeModal();HOME=true;render();window.scrollTo(0,0)}
function goApp(){closeModal();HOME=false;render();window.scrollTo(0,0)}
function home(){
  const it=(ic,t,fn,cls)=>`<button class="menu-item ${cls||''}" onclick="${fn}"><span>${ic}</span>${t}</button>`;
  const main=S.started?it('▶','Spieltag fortsetzen ('+S.hands.length+' Spiele)','goApp()','prim'):it('＋','Neuer Spieltag','goApp()','prim');
  const items=[...(S.started?[it('⚙','Einstellungen','openSettings()'),it('✅','Spieltag abschließen','closeDay()')]:[]),it('📋','Gesamtansicht','openOverview()'),it('📊','Statistik','openStats()'),it('🏆','Saisons','openSeasons()'),it('📅','Termine','openAppts()'),it('📤','Export / Senden','openExport()'),it('📥','Import','openImport()'),it('🔍','Suche','openSearch()'),it('❓','Hilfe','openHelp()'),it('ℹ','Info','openInfo()')];
  return `<div class="home"><div class="homelogo" onclick="openInfo()">${logoSvg(S.logo,240)}</div><h1 class="hometitle">${APP_NAME}</h1><div class="muted" style="text-align:center;margin-bottom:14px">${APP_TAG}<br><small>Version ${APP_VERSION}</small></div><div class="homemain">${main}</div>${nextApptLine()}<div class="menu-grid">${items.join('')}</div></div>`;
}
function render(){
  document.getElementById('app').innerHTML=HOME?home():S.started?board():setup();
  fixSticky();
}
function fixSticky(){
  const t=document.getElementById('topbar'),h1=document.querySelector('tr.h1'),r=document.documentElement.style;
  r.setProperty('--topH',t?t.offsetHeight+'px':'0px');
  r.setProperty('--h1H',h1?h1.offsetHeight+'px':'0px');
}
window.addEventListener('resize',fixSticky);
// Name per Auswahlmenü (Guido, Karsten, Martin, Peter, früher benutzte Namen) oder frei eingeben
function nameField(i){
  const cur=S.players[i],list=S.nameList,custom=!list.includes(cur);
  return `<div class="${custom?'row2':''}" style="margin-bottom:8px"><select onchange="pickName(${i},this.value)">${list.map(x=>`<option value="${esc(x)}" ${cur===x?'selected':''}>${esc(x)}</option>`).join('')}<option value="__new" ${custom?'selected':''}>Anderer Name …</option></select>
  ${custom?`<input type="text" id="nm${i}" value="${esc(cur)}" placeholder="Neuer Name" oninput="S.players[${i}]=this.value.trim()" onchange="S.players[${i}]=this.value.trim()||NAMES[${i}];render()">`:''}</div>`;
}
function pickName(i,v){
  if(v==='__new'){S.players[i]='';render();const el=document.getElementById('nm'+i);if(el)el.focus();return}
  S.players[i]=v;render();
}
function startDay(){
  for(let i=0;i<S.n;i++){if(!S.players[i])S.players[i]=NAMES[i]}
  S.startDealer=0; // der 1. eingetragene Spieler gibt zuerst
  S.players.slice(0,S.n).forEach(p=>{if(!S.nameList.includes(p))S.nameList.push(p)});
  S.players=S.players.slice(0,S.n);S.events=[];S.started=true;HOME=false;save();render();
}
function setup(){
  const n=S.n;padPlayers();
  return `<h1 style="display:flex;align-items:center;gap:10px;cursor:pointer" onclick="goHome()" title="Startbildschirm">${logoSvg(S.logo,40)} ${APP_NAME}</h1>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px"><button class="btn sec" onclick="goHome()">🏠 Start</button>${undoBtn()}<button class="btn sec menu-btn" onclick="openMenu()">☰ Menü</button><span class="dsk"><button class="btn sec" onclick="openOverview()">📋 Gesamtansicht</button><button class="btn sec" onclick="openStats()">📊 Statistik</button><button class="btn sec" onclick="openSeasons()">🏆 Saisons</button><button class="btn sec" onclick="openExport()">📤 Export / Senden</button>${helpBtns()}<button class="btn sec" onclick="openImport()">📥 Import</button></span></div>
  <div class="card">
  <label>Anzahl Spieler</label>
  <div class="seg"><button class="${n===3?'on':''}" onclick="S.n=3;render()">3 Spieler</button><button class="${n===4?'on':''}" onclick="S.n=4;render()">4 Spieler (Geber setzt aus)</button></div>
  <label>Namen (in Sitzreihenfolge im Uhrzeigersinn)</label>
  ${[0,1,2,3].slice(0,n).map(i=>nameField(i)).join('')}
  <p class="muted">Der erste eingetragene Spieler ist der erste Geber.</p>
  <div class="row2"><div><label>Grundeinsatz (€)</label><input type="number" min="0" step="0.5" value="${S.stake.base}" onchange="setStake('base',this.value)"></div>
  <div><label>Wert von 100 Punkten (€)</label><input type="number" min="0" step="0.1" value="${S.stake.per100}" onchange="setStake('per100',this.value)"></div></div>
  <p class="muted">Der Spieltag beginnt mit ${n} Bock-/Ramschrunden. Jede Runde besteht aus ${n} Bock-Spielen (doppelte Wertung) und ${n} Ramsch-Spielen. Ein mit Kontra (oder höher) verlorenes Spiel und ein mit genau 60 Augen verlorenes Spiel hängen je eine weitere Runde an (mit Hinweis, den du bestätigst). Sind keine Runden mehr offen, läuft Malenko.</p>
  ${(()=>{const nms=S.players.slice(0,n).map(x=>x.trim()),dup=nms.some((x,i)=>x&&nms.indexOf(x)!==i);return `${dup?'<p class="lost">Ein Name kommt doppelt vor.</p>':''}<button class="btn" ${dup?'disabled':''} onclick="startDay()">Spiel starten</button>`})()}
  </div>`;
}
function board(){
  const R=replay(),n=S.players.length,nn=R.N;
  const all=[...Array(n).keys()];
  const hh=[],tt=[]; // Überschriften (Namen) und Gesamtsummen direkt darunter
  all.forEach(i=>{
    const isD=i===R.dealer,inGame=R.seat.includes(i),inf=R.info[i];
    if(!inGame&&R.pending.includes(i)){hh.push(`<th class="pc gone"><div class="nm">${nm(i)}</div><div class="tag">steigt nach der Runde ein</div></th>`);tt.push(`<th class="pc tot gone">–</th>`);return}
    if(!inGame){hh.push(`<th class="pc gone"><div class="nm">${nm(i)}</div><div class="tag">ging nach Spiel ${inf.leaveAt}${inf.proj!=null?' · Ende '+(R.totals[i]+inf.proj)+' ('+(inf.proj>=0?'+':'')+inf.proj+')':''}</div></th>`);tt.push(`<th class="pc tot gone">${R.totals[i]}</th>`);return}
    const gl=R.rounds>0?'':[['grand','G','Grand'],['ramsch','R','Ramsch'],['farbe','F','Farbspiel']].map(([g,l,t])=>`<span class="gl ${R.done[i].has(g)?'red':'green'}" title="${t}: ${R.done[i].has(g)?'schon gespielt':'noch offen'}">${l}</span>`).join('');
    hh.push(`<th class="pc ${isD?'deal':''}">${gl?`<div class="gls"><span class="mlabel">MALENKO:</span>${gl}</div>`:''}<div class="nm">${nm(i)}</div><div class="tag">${isD?(nn===4?'Geber (setzt aus)':'Geber'):(inf.start!=null?'Start '+inf.start+' (Schnitt)':'')}</div></th>`);
    tt.push(`<th class="pc tot">${R.totals[i]}</th>`);
  });
  let ban='';
  if(R.rounds>0){
    const total=R.rounds; // offene Bock-/Ramschrunden (die laufende eingerechnet)
    const sp=R.slot==='bock'?`Bock-Spiel ${R.pos+1} von ${nn} (×${levelF(1)})`:`Ramsch-Spiel ${R.pos-nn+1} von ${nn}`;
    ban=`<div class="banner orange">Bock-/Ramschrunden offen: <b>${total}</b> · aktuell: ${sp}${R.canChange?'':' · 🔒 Spielerwechsel gesperrt'}</div>`;
  }else{
    ban='';
  }
  if(R.ramschLeft>0&&R.slot!=='ramsch')ban+=`<div class="banner bock"><b>Ramsch-Pflicht:</b> noch <b>${R.ramschLeft}</b> Ramsch-Spiel(e) (alle haben gepasst)${R.nextLevel>0?' · zählen mit Bock-Faktor':''}</div>`;
  if(!R.canChange&&!R.mal&&R.rounds===0)ban+=`<div class="banner mal"><b>Malenko:</b> das letzte Spiel der Runde läuft · 🔒 Spielerwechsel erst danach möglich</div>`;
  if(R.mal)ban+=`<div class="banner mal"><b>Malenko:</b> ${nm(R.mal.player)} muss spielen · offen: ${R.mal.remaining.map(g=>GROUPN[g]).join(' / ')}${R.canChange?'':' · 🔒 Spielerwechsel bis Ende der Malenko-Runde gesperrt'}</div>`;
  let svSum=0;
  const rows=R.rows.slice().reverse().map(r=>{
    const h=r.h,c=r.c;
    const cells=all.map(i=>{const v=c.pts[i];if(!r.seat.includes(i))return `<td class="pc muted"></td>`;return v==null?`<td class="pc muted">-</td>`:`<td class="pc ${v>0?'lost':'won'}" title="${v>0?'+':''}${v} in diesem Spiel">${r.cum[i]}</td>`}).join('');
    let sv='-';
    if(c.open)sv='<span class="opn">läuft</span>';
    else if(c.kind==='game'){
      const sf=STAGEF[stageOf(h)],bf=r.lv>0?levelF(r.lv):1,lf=c.won?1:S.settings.lossFactor;
      const fs=[sf,lf,bf].filter(x=>x>1);
      sv=c.value*sf*lf*bf;
    }
    else if(h.durchmarsch!=null&&h.durchmarsch!=='')sv=120;
    else{sv=Math.max(...Object.values(c.pts).concat([0]))} // Ramsch: Wert inkl. Jungfrau und Bock = verlorene Punkte des Verlierers
    if(typeof sv==='number')svSum+=sv;
    // dicker Strich vor jedem Spiel, das der 1. Geber gibt (Beginn einer neuen Geberrunde)
    return `<tr class="row ${r.dealer===R.rows[0].dealer?'cyc':''}" onclick="openForm(${r.i})"><td>${r.i+1}</td><td><span class="rn">${r.i+1}.</span> ${descr(r)}</td>${cells}<td class="num"><b>${sv}</b></td></tr>`}).join('');
  return `<div class="top" id="topbar"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><span onclick="goHome()" style="cursor:pointer;display:inline-flex" title="Startbildschirm">${logoSvg(S.logo,34)}</span><button class="btn sec" onclick="goHome()">🏠</button>${undoBtn()}<button class="btn sec menu-btn" onclick="openMenu()">☰ Menü</button><span class="dsk"><button class="btn sec" onclick="openSettings()">⚙ Einstellungen</button><button class="btn sec" onclick="openOverview()">📋 Gesamtansicht</button><button class="btn sec" onclick="openStats()">📊 Statistik</button><button class="btn sec" onclick="openSeasons()">🏆 Saisons</button><button class="btn sec" onclick="closeDay()">✅ Spieltag abschließen</button><button class="btn sec" onclick="openExport()">📤 Export / Senden</button>${helpBtns()}</span></div>${ban}</div>
  <div class="card"><table class="gt" style="--np:${n}"><thead><tr class="h1"><th>#</th><th>Spiel</th>${hh.join('')}<th class="num">Spielwert</th></tr>
  <tr class="h2"><th></th><th>Summe verlorene Punkte</th>${tt.join('')}<th class="num" title="Summe aller Spielwerte">Σ ${svSum}</th></tr></thead>
  <tbody>${rows||`<tr><td colspan="${n+3}" class="muted">Noch kein Spiel eingetragen.</td></tr>`}</tbody></table></div>
  ${(()=>{const li=S.hands.length-1;return li>=0&&S.hands[li].open?`<button class="btn fab" onclick="openForm(${li})">Ergebnis eintragen</button>`:`<button class="btn fab" onclick="openForm(null)">+ Spiel anlegen</button>`})()}`;
}
function wertTxt(r){
  const h=r.h,c=r.c;
  const parts=c.mult?[c.base,c.mult]:[c.value];
  const sf=STAGEF[stageOf(h)],bf=r.lv>0?levelF(r.lv):1,lf=(c.won||c.open)?1:S.settings.lossFactor;
  if(sf>1)parts.push(sf);
  if(lf>1)parts.push(lf);
  if(bf>1)parts.push(bf);
  const total=parts.length>1||!c.mult?c.value*sf*lf*bf:c.value;
  return parts.length>1?`${total} (${parts.join(' × ')})`:`${total}`;
}
function descr(r){
  const h=r.h,c=r.c;let s='';
  const chips=[];
  if(r.lv>0)chips.push(`Bock ×${levelF(r.lv)}`);
  if(h.malPlayer!=null&&h.malPlayer!=='')chips.push('Malenko');
  if(h.type==='ramsch'){
    if(h.passe)chips.push('alle gepasst');
    const av=r.play.map(i=>esc(S.players[i])+' '+((h.augen||{})[i]??'?')).join(' · ');
    return `<b>Ramsch</b> ${chips.map(x=>`<span class="chip">${x}</span>`).join('')}<br><span class="muted">Augen: ${av}<br>${esc(c.text)}</span>`;
  }
  if(h.type!=='null'&&!c.open){chips.push((h.mo==='mit'?'mit ':'ohne ')+h.n+' gespielt '+(h.n+1))}
  if(h.veto)chips.push('Veto im Ramsch');
  if(h.spitze&&S.settings.spitze&&h.type!=='null')chips.push('Spitze ×2');
  if(h.hand&&(!h.ouvert||h.ouvertFree))chips.push('Hand +1');if(h.ouvert)chips.push('Ouvert');if(h.schnAng)chips.push('Schn. ang.');if(h.schwarzAng)chips.push('Schw. ang.');
  if(stageOf(h))chips.push(STAGEN[stageOf(h)]+' ×'+STAGEF[stageOf(h)]+' ('+h.contra.map(i=>esc(S.players[i])).join(', ')+')');
  const lost=(c.pts[h.declarer]||0)>0;
  const res=c.open?`<span class="opn">läuft – Ergebnis folgt</span>`:`<span class="${lost?'lost':'won'}">${lost?'verloren':'gewonnen'}${c.over?' (überreizt)':''}</span>`;
  return `<b>${TYPES[h.type].n}</b> · ${esc(S.players[h.declarer])}${c.open&&h.type!=='null'?'':' · Wert '+wertTxt(r)}${h.reiz?` · gereizt ${h.reiz}`:''} · ${res}<br>${chips.map(x=>`<span class="chip">${x}</span>`).join('')}<span class="muted">${c.open?'':OUTN[h.outcome]}${c.open?'':h.augenSp!=null&&h.augenSp!==''?' · Augen '+h.augenSp+' : '+(120-h.augenSp):''}</span>`;
}

/* ---------- Eingabeformular ---------- */
function newF(R){
  const act=R.play;
  const f={type:'kreuz',declarer:act[0],reiz:null,mo:'mit',n:1,hand:false,schnAng:false,schwarzAng:false,ouvert:false,
    outcome:'W',contra:[],stage:1,levelOverride:null,augen:{},jungfrau:false,durchmarsch:null,malPlayer:null};
  if(R.forcedRamsch){f.type='ramsch'}
  else if(R.mal){f.malPlayer=R.mal.player;f.declarer=R.mal.player;f.type=R.mal.remaining.includes('farbe')?'kreuz':R.mal.remaining[0]==='grand'?'grand':'ramsch'}
  return f;
}
let ctx=null;
function openForm(i){
  const R=replay();
  editIdx=i;
  if(i==null){F=newF(R);ctx={dealer:R.dealer,play:R.play,seat:R.seat,auto:R.nextLevel,mal:R.mal,free:false,ramschLeft:R.forcedRamsch?1:0,forcedInfo:R.forcedInfo}}
  else{const r=R.rows[i];F=JSON.parse(JSON.stringify(r.h));ctx={dealer:r.dealer,play:r.play,seat:r.seat,auto:r.lv,mal:null,free:true,ramschLeft:0,wasForced:r.forced>0||r.slot==='ramsch'};
    if(F.contra==null)F.contra=[];if(F.augen==null)F.augen={};if(!F.open)F.outcomeSet=true;
    if(F.ouvert&&!F.ouvertFree&&F.type!=='null'){F.hand=true;F.schnAng=true;F.schwarzAng=true} // alte Ouvert-Spiele: eingeschlossene Ansagen sichtbar machen
    F.ouvertFree=true}
  drawForm();
}
function closeModal(){document.getElementById('modal').innerHTML='';F=null}
function toggleVeto(v){
  F.veto=v;F.passe=v?F.passe:F.passe;
  if(v){
    F.type='grand';F.hand=true;F.outcome='W';F.augenSp=null;
    const mp=ctx.mal&&!ctx.free&&editIdx==null?ctx.mal.player:null;
    // Malenko: Aufgabe des Malenko-Spielers (Ramsch) gilt als erledigt, er selbst darf kein Veto einlegen
    F.malPlayer=mp;F.declarer=null; // der Spieler mit Grand Hand muss ausgewählt werden
  }
  else{F.type='ramsch';F.hand=false;if(ctx.mal&&!ctx.free){F.malPlayer=ctx.mal.player}}
  drawForm();
}
function allowed(t){
  if(editIdx!=null)return t===F.type; // Spielart ist beim Ergebnis eintragen / Bearbeiten festgelegt (nur über Rückgängig änderbar)
  if(F&&F.veto)return t==='grand';
  if(ctx.ramschLeft>0)return t==='ramsch';
  if(!ctx.mal||ctx.free)return true;
  const g=groupOf(t);return ctx.mal.remaining.includes(g);
}
function setF(k,v){
  F[k]=v;
  if(k==='outcome')F.outcomeSet=true;
  if(k==='jungfrau'&&v)F.durchmarsch=null;           // Jungfrau und Durchmarsch schließen sich aus
  if(k==='durchmarsch'&&v!=null)F.jungfrau=false;
  if(k==='type'&&v!=='ramsch')F.passe=false;
  if(k==='type'&&ctx.mal&&!ctx.free){F.malPlayer=ctx.mal.player;F.declarer=ctx.mal.player}
  if(k==='type'&&F.type==='grand'&&F.n>4)F.n=4;
  F.ouvertFree=true;
  // Ouvert setzt keine weiteren Ansagen automatisch (Hand, Schneider, Schwarz wählst du selbst)
  if(k==='schwarzAng'&&v)F.schnAng=true;
  if(k==='schnAng'&&!v)F.schwarzAng=false;
  if(k==='declarer'){F.contra=F.contra.filter(x=>x!==v)}
  if(k==='type')F.outcome=(F.augenSp!==''&&F.augenSp!=null&&v!=='null'&&v!=='ramsch')?outFrom(F.augenSp,false):(F.outcome[0]==='W'?'W':'L');
  drawForm();
}
function toggleContra(i){
  const p=F.contra.indexOf(i);p<0?F.contra.push(i):F.contra.splice(p,1);
  if(F.stage==null)F.stage=1;drawForm();
}
function toggleStage(s){
  F.stage=stageOf(F)>=s?s-1:s;
  if(F.stage<1)F.stage=1;
  drawForm();
}
function freeMal(v){
  ctx.free=v;
  if(v){F.malPlayer=null}else if(ctx.mal){F.malPlayer=ctx.mal.player;F.declarer=ctx.mal.player;if(!allowed(F.type))F.type=ctx.mal.remaining[0]==='grand'?'grand':ctx.mal.remaining[0]==='ramsch'?'ramsch':'kreuz'}
  drawForm();
}
function redrawKeep(id){
  drawForm();
  const el=document.getElementById(id);
  if(el){el.focus();const v=el.value;el.value='';el.value=v} // Fokus behalten, Eingabe wird nicht unterbrochen
}
function augenIn(v){
  if(v===''){F.augenSp=null;redrawKeep('augSp');return}
  v=Math.max(0,Math.min(120,+v));if(isNaN(v))return;
  F.augenSp=v;
  F.outcome=outFrom(v,false);
  redrawKeep('augSp');
}
function outFrom(v,sw){
  if(v>=61)return v>=90?(sw?'WSW':'WS'):'W';
  return v<=30?(sw?'LSW':'LS'):'L';
}
function setSchwarz(b){F.outcome=outFrom(F.augenSp,b);drawForm()}
function seg(key,opts,cur){
  return `<div class="seg">${opts.map(([v,l,dis])=>`<button class="${cur===v?'on':''}" ${dis?'disabled':''} onclick="setF('${key}',${JSON.stringify(v).replace(/"/g,'&quot;')})">${l}</button>`).join('')}</div>`;
}
function drawForm(){
  const m=document.getElementById('modal');
  const old=m.querySelector('.sheet');const top=old?old.scrollTop:0;
  const act=ctx.play;
  const isR=F.type==='ramsch',isN=F.type==='null';
  // Neues oder noch offenes Spiel: erst Reizen/Ansagen eintragen, das Ergebnis folgt (am Ende der Maske)
  const resAtEnd=editIdx==null||!!F.open;let resHTML='';
  const resLocked=editIdx==null; // Ergebnis wird erst nach dem Spiel eingetragen: ausgegraut
  const fsOpen=resLocked?'<fieldset disabled style="border:0;padding:0;margin:0;opacity:.4">':'<fieldset style="border:0;padding:0;margin:0">';
  const isMalHand=F.malPlayer!=null&&F.malPlayer!==''; // Malenko: es wird nicht gereizt
  if(isMalHand&&F.reiz)F.reiz=null;
  let h=`<div class="modal"><div class="sheet"><h1>${editIdx==null?'Neues Spiel':'Spiel '+(editIdx+1)+' bearbeiten'}</h1>`;
  const autoLv=ctx.auto;
  if(editIdx==null&&ctx.mal){
    h+=`<div class="banner mal">Malenko: <b>${nm(ctx.mal.player)}</b> muss spielen · offen: ${ctx.mal.remaining.map(g=>GROUPN[g]).join(' / ')}
    <label class="chk"><input type="checkbox" ${ctx.free?'checked':''} onchange="freeMal(this.checked)"> Malenko-Zwang für dieses Spiel aufheben</label></div>`;
  }
  h+=`<label>Geber: ${nm(ctx.dealer)}</label>`;
  if(ctx.ramschLeft>0)h+=`<div class="banner bock">Ramsch-Pflicht – ${ctx.forcedInfo}</div>`;
  if(ctx.ramschLeft>0||F.veto||F.type==='ramsch')h+=`<label class="chk" style="${editIdx!=null?'opacity:.45':''}"><input type="checkbox" ${F.veto?'checked':''} ${editIdx!=null?'disabled':''} onchange="toggleVeto(this.checked)"> Ein Spieler sagt Grand Hand an (Veto) – sonst ist nur Ramsch erlaubt; der Spieler wird gewählt, Grand Hand wird automatisch gesetzt (${ctx.mal&&!ctx.free?'Malenko: nicht der Spieler mit der Aufgabe, seine Ramsch-Aufgabe gilt als erledigt':'Ramsch-Spiel wird nachgeholt'})</label>`;
  h+=`<label>Spielart${editIdx!=null?' – festgelegt (nur über „Rückgängig“ änderbar)':''}</label>`;
  h+=seg('type',Object.entries(TYPES).map(([k,v])=>[k,v.n,!allowed(k)]),F.type);
  h+='@@BTNS@@'; // Knöpfe direkt unter der Spielauswahl
  if(!isR){
    h+=`<div class="row2"><div><label>Alleinspieler</label><select onchange="setF('declarer',+this.value)" ${ctx.mal&&!ctx.free&&editIdx==null&&!F.veto?'disabled':''}>${F.declarer==null?'<option value="" disabled selected>– Spieler wählen –</option>':''}${act.filter(i=>!(F.veto&&F.malPlayer!=null&&F.malPlayer!==''&&i===+F.malPlayer)).map(i=>`<option value="${i}" ${F.declarer===i?'selected':''}>${esc(S.players[i])}</option>`).join('')}</select></div>
    ${isMalHand?'':`<div><label>Gereizt bis</label><select onchange="setF('reiz',this.value?+this.value:null)"><option value="">– nicht gereizt –</option>${REIZ.map(v=>`<option ${F.reiz===v?'selected':''}>${v}</option>`).join('')}</select></div>`}</div>`;
    resHTML='';
    if(isN)resHTML=`<label>Ergebnis${resAtEnd?' (jetzt oder später)':''}</label>`+seg('outcome',[['W','Gewonnen'],['L','Verloren']],F.outcomeSet?F.outcome:null);
    else{
      const av=F.augenSp,has=av!==''&&av!=null,won=F.outcome[0]==='W',sw=F.outcome.endsWith('SW');
      resHTML=`<label>Augen (Kartenwerte) des Alleinspielers${resAtEnd?' – jetzt oder später, wenn das Spiel gespielt ist':''}</label><input type="number" min="0" max="120" value="${has?av:''}" placeholder="0–120" id="augSp" oninput="augenIn(this.value);">`;
      if(has){
        resHTML+=`<div class="prev" style="margin:8px 0">Gegner ${120-av} Augen → <span class="${won?'won':'lost'}">${OUTN[F.outcome].replace(', Schneider',' mit Schneider').replace(', Schwarz',' mit Schwarz')}</span> (ohne Ansagen)</div>`;
        if(av>=90||av<=30)resHTML+=`<label class="chk"><input type="checkbox" ${sw?'checked':''} onchange="setSchwarz(this.checked)"> Schwarz (${av>=90?'Gegner machen keinen Stich':'Alleinspieler macht keinen Stich'})</label>`;
      }
    }
    if(!isN){ // Buben und Anzahl werden erst zusammen mit dem Ergebnis abgefragt
      const mx=F.type==='grand'?4:11;
      resHTML+=`<div class="row2"><div><label>Buben</label><select onchange="setF('mo',this.value)"><option value="mit" ${F.mo==='mit'?'selected':''}>mit</option><option value="ohne" ${F.mo==='ohne'?'selected':''}>ohne</option></select></div>
      <div><label>Anzahl</label><select onchange="setF('n',+this.value)">${Array.from({length:mx},(_,k)=>`<option ${F.n===k+1?'selected':''}>${k+1}</option>`).join('')}</select></div></div>`;
    }
    resHTML=fsOpen+resHTML+'</fieldset>';
    if(!resAtEnd)h+=resHTML;
    h+=`<label>Ansagen</label>${S.settings.spitze&&!isN?`<label class="chk"><input type="checkbox" ${F.spitze?'checked':''} onchange="setF('spitze',this.checked)"> Spitze (umgekehrte Rangfolge, 7 Trumpf, Wert ×2)</label>`:''}
    <label class="chk"><input type="checkbox" ${F.hand?'checked':''} ${F.veto?'disabled':''} onchange="setF('hand',this.checked)"> Hand</label>
    <label class="chk"><input type="checkbox" ${F.ouvert?'checked':''} onchange="setF('ouvert',this.checked)"> Ouvert</label>`;
    if(!isN)h+=`<label class="chk"><input type="checkbox" ${F.schnAng||F.schwarzAng?'checked':''} onchange="setF('schnAng',this.checked)"> Schneider angesagt</label>
    <label class="chk"><input type="checkbox" ${F.schwarzAng?'checked':''} onchange="setF('schwarzAng',this.checked)"> Schwarz angesagt</label>`;
    h+=`<label>Kontra gesagt von</label><div class="seg">${act.filter(i=>i!==F.declarer).map(i=>`<button class="${F.contra.includes(i)?'on':''}" onclick="toggleContra(${i})">${esc(S.players[i])}</button>`).join('')}</div>
    <label>Weitere Ansagen (nacheinander: Kontra ×2 → Re ×4 → Hirsch ×8 → Geweih ×16)</label>
    <div class="seg"><button class="${stageOf(F)>=1?'on':''}" disabled>Kontra ×2 (Gegner)</button>${[[2,'Re ×4 (Alleinspieler)'],[3,'Hirsch ×8 (Gegner)'],[4,'Geweih ×16 (Alleinspieler)']].map(([s,l])=>`<button class="${stageOf(F)>=s?'on':''}" ${stageOf(F)>=s-1&&F.contra.length?'':'disabled'} onclick="toggleStage(${s})">${l}</button>`).join('')}</div>`;
  }else{
    const fa=ramschAugen(act);
    const cur=fa||F.augen,isSet=i=>cur[i]!==''&&cur[i]!=null;
    const who120=act.find(i=>isSet(i)&&+cur[i]===120);
    const hasZero=act.some(i=>isSet(i)&&+cur[i]===0); // auch bei 120 Augen möglich: Jungfrau + ein Stich mit 0 Punkten (dann kein Durchmarsch)
    if(!hasZero)F.jungfrau=false;
    if(who120==null)F.durchmarsch=null;else if(F.durchmarsch!=null&&F.durchmarsch!==who120)F.durchmarsch=who120;
    const sum=act.reduce((s,i)=>s+(+F.augen[i]||0),0);
    const emp=act.filter(i=>F.augen[i]===''||F.augen[i]==null);
    const forcedR=ctx.ramschLeft>0||ctx.wasForced; // Pflicht-Ramsch (auch beim späteren Ergebnis eintragen)
    const noPass=isMalHand||forcedR; // in einem Pflicht-Ramsch kann niemand mehr passen
    if(noPass)F.passe=false;
    h+=`<label class="chk" style="${noPass?'opacity:.45':''}"><input type="checkbox" ${F.passe&&!noPass?'checked':''} ${noPass?'disabled':''} onchange="setF('passe',this.checked)"> Alle haben gepasst – löst ${ctx.seat.length} Ramsch-Spiele aus (dieses mitgerechnet)${isMalHand?' – im Malenko nicht möglich':forcedR?' – im Pflicht-Ramsch nicht möglich':''}</label>`;
    h+=fsOpen+`<label>Augen (Kartenwerte) je Spieler – jeder kann verlieren (inkl. Skat, Summe 120)${resLocked?' – wird später eingetragen':''}</label><div class="row2">${act.map(i=>`<div><label>${esc(S.players[i])}</label><input type="number" min="0" max="120" id="aug${i}" value="${F.augen[i]??''}" placeholder="${emp.length===1&&emp[0]===i&&sum<=120?120-sum:''}" oninput="F.augen[${i}]=this.value===''?'':Math.min(120,+this.value);redrawKeep('aug${i}')"></div>`).join('')}</div>
    <div class="muted">Summe: ${sum} ${sum===120?'✓':emp.length===1&&sum<=120?'(Rest '+(120-sum)+' wird beim leeren Feld eingetragen)':'(muss 120 sein)'}</div>
    <label class="chk" style="${hasZero&&F.durchmarsch==null?'':'opacity:.45'}"><input type="checkbox" ${F.jungfrau&&hasZero?'checked':''} ${hasZero&&F.durchmarsch==null?'':'disabled'} onchange="setF('jungfrau',this.checked)"> Jungfrau (×${S.settings.jungfrau})${hasZero?' – nur wenn jemand Jungfrau ist':' – nur wählbar, wenn ein Spieler 0 Augen hat'}</label>
    <label class="chk" style="${who120!=null&&!F.jungfrau?'':'opacity:.45'}"><input type="checkbox" ${F.durchmarsch!=null&&who120!=null?'checked':''} ${who120!=null&&!F.jungfrau?'':'disabled'} onchange="setF('durchmarsch',this.checked?${who120}:null)"> Durchmarsch${who120!=null?' ('+esc(S.players[who120])+' hat 120 Augen)':' – nur wenn ein Spieler 120 Augen hat'}</label></fieldset>`;
  }
  if(resAtEnd&&!isR)h+=resHTML;
  if(isMalHand){F.levelOverride=null;F.passe=false}
  h+=`<label style="${isMalHand?'opacity:.45':''}">Bockrunde (wirkt zusätzlich ×${S.settings.bock} auf alle Ansagen)${isMalHand?' – im Malenko gibt es keinen Bock':''}</label><select ${isMalHand?'disabled style="opacity:.45"':''} onchange="setF('levelOverride',this.value===''?null:+this.value)"><option value="">automatisch (${autoLv?'Bock ×'+levelF(1):'normal'})</option><option value="0" ${F.levelOverride===0?'selected':''}>Normal</option><option value="1" ${F.levelOverride>=1?'selected':''}>Bock ×${S.settings.bock}</option></select>`;
  const lv=isMalHand?0:(F.levelOverride!=null?F.levelOverride:autoLv);
  const hasAug=F.augenSp!==''&&F.augenSp!=null;
  const hasRes=isR?!!ramschAugen(act):isN?!!F.outcomeSet:hasAug;
  const fx={...F,open:!hasRes};
  const c=calc(isR?{...fx,augen:ramschAugen(act)||F.augen}:fx,lv,act,ctx.seat);
  const c0=hasRes?c:(isR?null:calc({...F,open:false},lv,act,ctx.seat));
  const ptxt=Object.entries(c.pts).map(([k,v])=>`${esc(S.players[k])}: ${v}`).join(' · ')||'keine Punkte';
  if(!hasRes&&!isR&&!isN){h+=`<div class="prev">Spiel wird angelegt${F.reiz?' · gereizt bis '+F.reiz:''} · Buben und Ergebnis (Augen) folgen, dann wird der Spielwert berechnet.</div>`}
  else h+=`<div class="prev">${!isR&&c0?`Spielwert ${c0.value}${c0.mult?` (Grundwert ${c0.base} × ${c0.mult})`:''}${hasRes?(c.cf*(c.won?1:S.settings.lossFactor)>1?` × Faktor ${c.cf*(c.won?1:S.settings.lossFactor)}${c.won?'':' (verloren ×'+S.settings.lossFactor+')'} = ${c.value*c.cf*(c.won?1:S.settings.lossFactor)}`:'')+` · ${c.won?'gewonnen':'verloren'}${c.over?' (überreizt)':''}`:(c0.cf>1?` × Faktor ${c0.cf} (ohne Verlust)`:'')+(F.reiz?` · gereizt ${F.reiz}`:'')+' · läuft, Ergebnis folgt'}<br>`:''}${hasRes?`Verlorene Punkte → ${ptxt}`:'Noch keine Punkte – das Ergebnis wird später eingetragen.'}</div>`;
  const valid=true;
  const btns=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0"><button class="btn" ${(!isR&&F.declarer==null)||(editIdx!=null&&F.open&&!hasRes)?'disabled':''} onclick="saveHand()">${editIdx==null?'Spiel anlegen':F.open?'Spiel abschließen':'Speichern'}</button><button class="btn sec" onclick="closeModal()">Abbrechen</button>
  ${editIdx!=null&&editIdx===S.hands.length-1?`<button class="btn bad" onclick="delHand()">Löschen</button>`:''}</div>`;
  h=h.replace('@@BTNS@@',btns)+`</div></div>`;
  m.innerHTML=h;
  const ns=m.querySelector('.sheet');if(ns)ns.scrollTop=top;
}
function ramschAugen(act){
  const a={};let sum=0,emp=[];
  act.forEach(i=>{const v=F.augen[i];if(v===''||v==null)emp.push(i);else{a[i]=+v;sum+=+v}});
  if(Object.values(a).some(v=>v===120)){act.forEach(i=>{if(a[i]==null)a[i]=0});return a} // Durchmarsch: 120 für einen, alle anderen 0
  if(emp.length===0)return sum===120?a:null;
  if(emp.length===1&&sum<=120){a[emp[0]]=120-sum;return a}
  return null;
}
function saveHand(){
  const h=JSON.parse(JSON.stringify(F));
  if(h.type==='ramsch'){h.declarer=null;h.reiz=null;h.augen=ramschAugen(ctx.play);if(ctx.ramschLeft>0)h.passe=false}
  // Bei 4 Spielern setzt der Geber aus und kann nie Alleinspieler sein
  else if(h.declarer!=null&&!ctx.play.includes(+h.declarer)){toast('Der Geber spielt bei 4 Spielern nicht mit und kann nicht Alleinspieler sein.',5000);return}
  // offen = Spiel angelegt (gereizt/angesagt), Ergebnis noch nicht eingetragen
  h.open=h.type==='ramsch'?!h.augen:h.type==='null'?!h.outcomeSet:!(h.augenSp!==''&&h.augenSp!=null);
  if(!h.open)delete h.open;
  const idx=editIdx==null?S.hands.length:editIdx;
  const was=editIdx!=null&&!!replay().rows[idx].c.newRound;
  if(editIdx==null)S.hands.push(h);else S.hands[editIdx]=h;
  const R=replay(),c=R.rows[idx]&&R.rows[idx].c;
  save();closeModal();render();
  if(c&&c.newRound&&!was)roundPopup(c,R);
}
// Hinweis: durch dieses Spiel ist eine neue Bock-/Ramschrunde entstanden - muss als gelesen bestätigt werden
function roundPopup(c,R){
  const why=c.contraWon?'Ein Spiel wurde mit Kontra (oder höher) gewonnen.':'Ein Spiel wurde mit genau 60 Augen verloren.';
  document.getElementById('modal').innerHTML=`<div class="modal"><div class="sheet" id="roundPop"><h1>🔔 Neue Bock-/Ramschrunde</h1><p>${why}</p><p>Es kommt eine <b>neue Bock-/Ramschrunde</b> dazu (${R.N} Bock- und ${R.N} Ramsch-Spiele). Offene Runden jetzt: <b>${R.rounds}</b>.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="roundOk" onclick="closeModal()">✔ Gelesen</button></div></div></div>`;
}
function delHand(){
  ask('Letztes Spiel wirklich löschen?','Ja, löschen',()=>{S.hands.pop();S.events=S.events.filter(e=>e.at<=S.hands.length);save();render()});
}

/* ---------- Einstellungen ---------- */
function openSettings(){
  const st=S.settings;
  const chk=(k,l)=>`<label class="chk"><input type="checkbox" ${st[k]?'checked':''} onchange="S.settings['${k}']=this.checked;save();render()"> ${l}</label>`;
  document.getElementById('modal').innerHTML=`<div class="modal"><div class="sheet"><h1>Einstellungen</h1>
  <label>Namen</label>${S.players.map((p,i)=>`<input type="text" value="${esc(p)}" style="margin-bottom:6px" onchange="S.players[${i}]=this.value.trim()||'Spieler ${i+1}';save();render()">`).join('')}
  <label>Mitspieler (wirkt ab dem nächsten Spiel)</label>
  ${(()=>{const R=replay();

  <div class="row2"><div><label>Grundeinsatz (€)</label><input type="number" min="0" step="0.5" value="${S.stake.base}" onchange="setStake('base',this.value)"></div>
