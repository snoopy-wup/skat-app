}
function joinPlayer(){
  if(!replay().canChange)return;
  const sel=document.getElementById('newSel'),el=document.getElementById('newName');
  const name=(sel&&sel.value!=='__new'?sel.value:(el&&el.value.trim()))||('Spieler '+(S.players.length+1));
  if(!S.nameList.includes(name))S.nameList.push(name);
  S.players.push(name);
  S.events.push({type:'join',p:S.players.length-1,at:S.hands.length});
  save();closeModal();render();
}
function leavePlayer(p){
  if(!replay().canChange)return;
  S.events.push({type:'leave',p,at:S.hands.length});
  save();closeModal();render();
}
function ask(text,yes,fn){
  window._ask=fn;
  document.getElementById('modal').innerHTML=`<div class="modal"><div class="sheet"><h1>${text}</h1><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn bad" onclick="closeModal();window._ask()">${yes}</button><button class="btn sec" onclick="closeModal()">Abbrechen</button></div></div></div>`;
}
function resetDay(){S.hands=[];S.events=[];S.started=false;S.n=4;S.startDealer=0;S.players=[...NAMES];S.settings={...DEF}}
function newGame(){
  closeDay();
}

/* ---------- Spieltage, Gesamtansicht, Statistik ---------- */
S.days=S.days||[];
S.stake=S.stake||{base:25,per100:0.5}; // zuletzt benutzte Werte bleiben für den nächsten Spieltag erhalten
const eur=v=>(Math.round(v*100)/100).toLocaleString('de-DE',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2})+' €';
// Punkte → €: Punktwert, immer auf volle Euro aufgerundet, plus Grundeinsatz
const payOf=(pts,stake)=>{const e=Math.ceil(pts*stake.per100/100-1e-9);return {euro:Math.max(0,e),total:Math.max(0,e)+(+stake.base||0)}};
function setStake(k,v){const x=parseFloat(String(v).replace(',','.'));S.stake[k]=isNaN(x)||x<0?0:x;save()}
const fmtDate=d=>new Date(d).toLocaleDateString('de-DE');
function curDay(){return {id:'cur',current:true,season:S.season.id,date:new Date().toISOString(),players:S.players,hands:S.hands,events:S.events,startDealer:S.startDealer,n:S.n,settings:S.settings}}
// Spieltag beenden: speichern (Abrechnung) oder löschen (mit zweiter Rückfrage) - geht immer, auch ohne Spiele oder mit laufendem Spiel
function savableHands(){return S.hands.filter(h=>!h.open)}
function closeDay(){
  const open=S.hands.filter(h=>h.open).length,done=savableHands();
  const del=`<button class="btn bad" onclick="confirmDeleteDay()">🗑 Spieltag löschen</button>`;
  if(!done.length){
    showSheet(`<h1>Spieltag beenden</h1><p>${S.hands.length?'Es gibt nur ein Spiel ohne Ergebnis.':'Es ist noch kein Spiel eingetragen.'} Es gibt nichts zu speichern. Der Spieltag kann nur gelöscht werden.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${del}<button class="btn sec" onclick="closeModal()">Abbrechen</button></div>`);return}
  const a=analyze({...curDay(),hands:done});
  const ent=entries(a).sort((x,y)=>x.end-y.end);
  const rows=ent.map(e=>`<tr><td>${esc(e.name)}${e.ghost?' <span class="muted">(abwesend – Schnitt)</span>':''}</td><td class="pc">${e.end}</td><td class="pc">${eur(e.pay.euro)}</td><td class="pc">${eur(+S.stake.base||0)}</td><td class="pc"><b>${eur(e.pay.total)}</b></td></tr>`).join('');
  const tot=ent.reduce((s,e)=>s+e.pay.total,0);
  showSheet(`<h1>Spieltag beenden</h1><p class="muted">${esc(S.season.name)} · ${done.length} Spiele</p>${open?`<div class="banner orange">Ein Spiel ohne Ergebnis wird beim Speichern nicht mitgenommen.</div>`:''}<div class="scroll"><table><thead><tr><th>Spieler</th><th class="pc">Punkte</th><th class="pc">Punktwert (${eur(+S.stake.per100)}/100, aufgerundet)</th><th class="pc">Grundeinsatz</th><th class="pc">Zu zahlen</th></tr></thead><tbody>${rows}</tbody><tfoot><tr><th colspan="4">Gesamtsumme aller Zahlungen</th><th class="pc">${eur(tot)}</th></tr></tfoot></table></div>
  <p class="muted">Speichern legt den Spieltag in der Gesamtansicht ab, danach beginnt ein neuer Spieltag. Löschen verwirft ihn ohne Spuren (danach noch eine Rückfrage).</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="saveDay" onclick="doCloseDay()">💾 Speichern</button><button class="btn" onclick="doCloseDay('wa')">💬 Speichern und an WhatsApp senden</button><button class="btn sec" onclick="doCloseDay(true)">💾 Speichern und senden an …</button>${del}<button class="btn sec" onclick="closeModal()">Abbrechen</button></div>
  <p class="muted">„Senden an …“ öffnet das Teilen-Menü des Geräts, dort wählst du z. B. die WhatsApp-Gruppe. Gesendet werden das Ergebnis als Text und eine Datei mit allen Daten (alle Saisons und Spiele).</p>`);
}
function confirmDeleteDay(){
  ask('Wirklich löschen? Der Spieltag wird endgültig verworfen und nicht gespeichert.','Ja, endgültig löschen',doDeleteDay);
}
function doDeleteDay(){resetDay();save();closeModal();HOME=true;render()}
function doCloseDay(send){
  S.hands=savableHands();
  const text=send?summaryText(curDay()):null; // vor dem Zurücksetzen berechnen
  const d=JSON.parse(JSON.stringify({id:Date.now(),season:S.season.id,date:new Date().toISOString(),players:S.players,hands:S.hands,events:S.events,startDealer:S.startDealer,n:S.n,settings:S.settings,stake:S.stake}));
  S.days.push(d);resetDay();save();closeModal();HOME=true;render();
  if(send==='wa')waDialog({title:'Nachricht mit den Zahlungen',text,name:exportName(),content:JSON.stringify(S,null,1),mime:'application/json'});
  else if(send)shareAll(text);
}// Spieltag durchrechnen (S wird kurz auf den Spieltag umgestellt)
// Spieltag ohne Einzelspiele (day.imp = {Name: gezahlter Betrag inkl. Grundeinsatz}, z. B. aus Excel): Beträge gelten, Punkte ≈ zurückgerechnet
function analyzeImp(day,stake){
  const base=+stake.base||0,per=+stake.per100||0;
  const part=[];day.players.forEach((n,i)=>{if(day.imp[n]!=null)part.push(i)});
  const end=day.players.map(n=>day.imp[n]==null||!per?0:Math.round(Math.max(0,day.imp[n]-base)*100/per));
  const pay=day.players.map(n=>{const t=+day.imp[n]||0;return {euro:Math.max(0,t-base),total:t}});
  return {R:{rows:[]},part,end,pay};
}
const gamesTxt=d=>d.imp?'nur Beträge':d.hands.length+' Spiele';
function analyze(day){
  const stake=day.current?S.stake:(day.stake||S.stake);
  let R,part,end,pay;
  if(day.imp)({R,part,end,pay}=analyzeImp(day,stake));
  else{
    const bak={players:S.players,hands:S.hands,events:S.events,n:S.n,startDealer:S.startDealer,settings:S.settings};
    Object.assign(S,{players:day.players,hands:day.hands,events:day.events||[],n:day.n,startDealer:day.startDealer,settings:{...S.settings,...(day.settings||{}),...FIX}});
    try{R=replay()}finally{Object.assign(S,bak)}
    part=[];day.players.forEach((_,i)=>{if(i<day.n||R.info[i].joinAt!=null)part.push(i)});
    end=R.totals.map((t,i)=>t+(R.info[i].proj||0));
    pay=end.map(e=>payOf(e,stake));
  }
  const rank={};part.forEach(i=>{rank[i]=1+part.filter(j=>end[j]<end[i]).length});
  // Spielt man nur zu dritt, bekommt der fehlende Stammspieler den Schnitt der Punkte (und die daraus folgenden €)
  const ghosts=[];
  if(part.length&&part.length<4){
    const here=part.map(i=>day.players[i]);
    const avg=Math.round(part.reduce((s,i)=>s+end[i],0)/part.length);
    NAMES.filter(x=>!here.includes(x)).slice(0,4-part.length).forEach(name=>ghosts.push({name,end:avg,pay:payOf(avg,stake)}));
  }
  return {day,R,part,end,rank,pay,stake,ghosts};
}
const entries=a=>[...a.part.map(i=>({name:a.day.players[i],end:a.end[i],pay:a.pay[i],rank:a.rank[i],ghost:false})),...a.ghosts.map(g=>({name:g.name,end:g.end,pay:g.pay,rank:null,ghost:true}))];
// Saisons: Spieltage gehören zur Saison, in der sie abgeschlossen wurden
S.season=S.season||{id:1,name:'Saison 1',start:new Date().toISOString()};
S.pastSeasons=S.pastSeasons||[];
S.days.forEach(d=>{if(d.season==null)d.season=S.season.id});
let VIEWSEASON=null; // null = aktuelle Saison, 'all' = alle
const viewSeason=()=>VIEWSEASON==null?S.season.id:VIEWSEASON;
const seasonName=id=>(id===S.season.id?S.season:S.pastSeasons.find(s=>s.id===id)||{name:'?'}).name;
function daysOf(sel,includeCur){
  return [...S.days.filter(d=>sel==='all'||d.season===sel),...(includeCur&&S.hands.length&&(sel==='all'||sel===S.season.id)?[curDay()]:[])];
}
function allDays(includeCur){return daysOf(viewSeason(),includeCur)}
function seasonSelect(fn){
  const all=[...S.pastSeasons,S.season];
  return `<select style="margin-bottom:8px" onchange="VIEWSEASON=this.value==='all'?'all':+this.value;${fn}()"><option value="all" ${viewSeason()==='all'?'selected':''}>Alle Saisons</option>${all.slice().reverse().map(s=>`<option value="${s.id}" ${viewSeason()===s.id?'selected':''}>${esc(s.name)}${s.id===S.season.id?' (aktuell)':''}</option>`).join('')}</select>`;
}
function showSheet(html){document.getElementById('modal').innerHTML=`<div class="modal"><div class="sheet wide">${html}${HOME?'':'<div class="homebar"><button class="btn sec" onclick="goHome()">🏠 Startbildschirm</button></div>'}</div></div>`}

function openOverview(){
  const list=allDays(true).map(analyze);
  const names=[];list.forEach(a=>entries(a).forEach(e=>{if(!names.includes(e.name))names.push(e.name)}));
  const sum={},cnt={},sumE={};names.forEach(n=>{sum[n]=0;cnt[n]=0;sumE[n]=0});
  const anyImp=list.some(a=>a.day.imp);
  let grand=0;
  const rows=list.slice().reverse().map((a,zx)=>{
    const ent=entries(a);
    const dayTot=ent.reduce((s,e)=>s+e.pay.total,0);grand+=dayTot;
    const cells=names.map(n=>{
      const e=ent.find(x=>x.name===n);
      if(!e)return `<td class="pc muted">-</td>`;
      sum[n]+=e.end;cnt[n]++;sumE[n]+=e.pay.total;
      const rk=e.ghost?'<span class="rk">Ø</span>':`<span class="rk r${e.rank}">${e.rank}.</span>`;
      // Spieltag nur mit Beträgen: der Betrag ist der echte Wert (oben), die Punkte sind zurückgerechnet (klein darunter, schmal genug fürs Handy)
      return a.day.imp?`<td class="pc"><b style="white-space:nowrap">${eur(e.pay.total)}</b> ${rk}<div class="tag">≈${e.end}</div></td>`:`<td class="pc"><b>${e.end}</b> ${rk}<div class="tag">${eur(e.pay.total)}</div></td>`;
    }).join('');
    const label=a.day.current?'läuft':fmtDate(a.day.date);
    const act=`<button class="btn sec sm" onclick="openStats('${a.day.current?'cur':'d'+a.day.id}')">Statistik</button>${a.day.current?'':` <button class="btn sec sm" title="Spieltag löschen" onclick="delDay(${a.day.id})">🗑</button>`}`; // Löschen nur mit doppelter Rückfrage
    return `<tr class="${zx%2?'z':''}"><td>${label}<div class="muted">${a.day.imp?[a.day.host?'bei '+esc(a.day.host):'',esc(a.day.note||'nur Beträge')].filter(Boolean).join(' · '):a.day.hands.length+' Spiele'}</div></td>${cells}<td class="pc"><b>${eur(dayTot)}</b></td><td>${act}</td></tr>`;
  }).join('');
  showSheet(`<h1>Gesamtansicht</h1>${seasonSelect('openOverview')}${list.length?`<div class="statwrap ov"><table><thead><tr><th>Spieltag</th>${names.map(n=>`<th class="pc">${esc(n)}</th>`).join('')}<th class="pc">Alle Zahlungen</th><th></th></tr>
  <tr><th>Summe (${list.length} Spieltage)</th>${names.map(n=>`<th class="pc tot2">${anyImp?`<span style="white-space:nowrap">${eur(sumE[n])}</span><div class="tag">${cnt[n]} Spieltage · ≈${sum[n]}</div>`:`${sum[n]}<div class="tag">${cnt[n]} Spieltage · ${eur(sumE[n])}</div>`}</th>`).join('')}<th class="pc tot2">${eur(grand)}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
  ${anyImp?'<p class="muted"><b>Spieltage „nur Beträge“</b> (ohne Einzelspiele, z. B. aus Excel): oben steht der gezahlte Betrag (echter Wert), darunter die daraus zurückgerechneten Punkte (<b>≈</b>). Die Summe zeigt dann zuerst die Zahlungen.</p>':''}
  <p class="muted">Zahl = verlorene Punkte am Spielende (Spieler, die früher gegangen sind, inkl. Schnitt; „Ø“ = nicht anwesender Stammspieler bei nur 3 Spielern, er bekommt den Schnitt), danach der Platz (1. = wenigste Punkte), darunter der zu zahlende Betrag (Punktwert aufgerundet + Grundeinsatz).</p>`:'<p class="muted">Noch kein Spieltag vorhanden.</p>'}
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="openStats('all')">Statistik aller Spieltage</button><button class="btn sec" onclick="openSeasons()">🏆 Saisons</button><button class="btn sec" onclick="closeModal()">Schließen</button></div>`);
}

/* ---------- Löschen von Spieltagen und Saisons (immer mit zwei Rückfragen) ---------- */
function delDay(id){
  const d=S.days.find(x=>x.id===id);if(!d)return;
  const txt=`${esc(fmtDate(d.date))} · ${esc(seasonName(d.season??S.season.id))} · ${gamesTxt(d)}`;
  ask(`Spieltag löschen? (1. Rückfrage)<br><small>${txt}</small>`,'Weiter …',()=>
    ask(`Wirklich endgültig löschen? (2. Rückfrage)<br><small>Der Spieltag ${txt} und alle seine Spiele verschwinden aus Gesamtansicht und Statistik. Mit „↶ Rückgängig“ lässt es sich nur zurücknehmen, solange die App offen bleibt. Sichere vorher über „Export“.</small>`,'Ja, Spieltag endgültig löschen',()=>doDelDay(id)));
}
function doDelDay(id){S.days=S.days.filter(x=>x.id!==id);save();openOverview();toast('Spieltag gelöscht')}
function delSeason(id){
  const cur=id===S.season.id,se=cur?S.season:S.pastSeasons.find(s=>s.id===id);if(!se)return;
  const n=S.days.filter(d=>d.season===id).length,g=S.days.filter(d=>d.season===id).reduce((s,d)=>s+d.hands.length,0);
  const txt=`${esc(se.name)} · ${n} Spieltage · ${g} Spiele`;
  ask(`Saison löschen? (1. Rückfrage)<br><small>${txt}</small>`,'Weiter …',()=>
    ask(`Wirklich endgültig löschen? (2. Rückfrage)<br><small>${cur?'Die aktuelle Saison':'Die Saison'} ${txt} ${cur?'wird mit allen ihren Spieltagen gelöscht'+(S.pastSeasons.length?'. Die zuletzt begonnene ältere Saison wird danach wieder die aktuelle':'. Danach beginnt eine neue, leere Saison'):'wird mit allen ihren Spieltagen gelöscht'}. Mit „↶ Rückgängig“ lässt es sich nur zurücknehmen, solange die App offen bleibt. Sichere vorher über „Export“.</small>`,'Ja, endgültig löschen',()=>doDelSeason(id)));
}
// Alle Spieltage der aktuellen Saison in eine ältere Saison übertragen (zwei Rückfragen)
function mergeSeason(){
  const sel=document.getElementById('mergeTarget'),tid=sel?+sel.value:null,msg=document.getElementById('seasonMsg');
  const target=S.pastSeasons.find(s=>s.id===tid),n=S.days.filter(d=>d.season===S.season.id).length;
  if(!target){if(msg)msg.textContent='Es gibt keine ältere Saison als Ziel.';return}
  if(!n){if(msg)msg.textContent='Die aktuelle Saison hat noch keine abgeschlossenen Spieltage.';return}
  const txt=`${n} Spieltage aus „${esc(S.season.name)}“ nach „${esc(target.name)}“`;
  ask(`Übertragen? (1. Rückfrage)<br><small>${txt}</small>`,'Weiter …',()=>
    ask(`Wirklich übertragen? (2. Rückfrage)<br><small>${txt}. Die Spieltage gehören danach zur älteren Saison und zählen in deren Statistik. Die aktuelle Saison bleibt leer bestehen. Mit „↶ Rückgängig“ lässt es sich nur zurücknehmen, solange die App offen bleibt.</small>`,'Ja, jetzt übertragen',()=>doMergeSeason(tid)));
}
function doMergeSeason(tid){
  const target=S.pastSeasons.find(s=>s.id===tid);if(!target)return;
  const moved=S.days.filter(d=>d.season===S.season.id);
  moved.forEach(d=>{d.season=tid});
  const last=moved.map(d=>d.date).sort().pop();
  if(last&&(!target.end||String(last)>String(target.end)))target.end=last;
  save();openSeasons();toast(moved.length+' Spieltage übertragen');
}
function doDelSeason(id){
  S.days=S.days.filter(d=>d.season!==id);
  if(id!==S.season.id)S.pastSeasons=S.pastSeasons.filter(s=>s.id!==id);
  else if(S.pastSeasons.length){ // aktuelle Saison gelöscht: die zuletzt begonnene ältere Saison wird wieder die aktuelle
    const prev=S.pastSeasons.slice().sort((a,b)=>String(a.start).localeCompare(String(b.start))).pop();
    S.pastSeasons=S.pastSeasons.filter(s=>s.id!==prev.id);
    S.season={id:prev.id,name:prev.name,start:prev.start};
  }else{ // keine ältere Saison vorhanden: es muss immer eine aktuelle geben, also eine neue leere
    S.season={id:Math.max(1,...S.days.map(d=>+d.season||0),id)+1,name:'Saison 1',start:new Date().toISOString()};
  }
  if(VIEWSEASON===id)VIEWSEASON=null;
  save();openSeasons();toast('Saison gelöscht');
}

/* ---------- Saisons ---------- */
function openSeasons(){
  const seasons=[...S.pastSeasons,S.season].slice().reverse();
  const data=seasons.map(se=>{
    const list=daysOf(se.id,se.id===S.season.id).map(analyze);
    const per={};let paid=0;
    list.forEach(a=>entries(a).forEach(e=>{const n=e.name;const p=per[n]||(per[n]={pts:0,eur:0,days:0,first:0});p.pts+=e.end;p.eur+=e.pay.total;p.days++;if(!a.day.current&&e.rank===1)p.first++;paid+=e.pay.total}));
    return {se,list,per,paid};
  });
  const names=[];data.forEach(d=>Object.keys(d.per).forEach(n=>{if(!names.includes(n))names.push(n)}));
  const rows=data.map(d=>{
    const best=Object.keys(d.per).sort((a,b)=>d.per[a].pts-d.per[b].pts)[0];
    return `<tr><td><b>${esc(d.se.name)}</b>${d.se.id===S.season.id?' <span class="rk r1">aktuell</span>':''}<div class="muted">${fmtDate(d.se.start)} – ${d.se.end?fmtDate(d.se.end):'läuft'} · ${d.list.length} Spieltage</div>
      <div style="margin-top:4px"><button class="btn sec sm" onclick="VIEWSEASON=${d.se.id};openStats('all')">Statistik</button> <button class="btn sec sm" onclick="VIEWSEASON=${d.se.id};openOverview()">Spieltage</button> <button class="btn sec sm" title="Saison löschen" onclick="delSeason(${d.se.id})">🗑 Saison löschen</button></div></td>
      ${names.map(n=>{const p=d.per[n];return p?`<td class="pc"><b>${p.pts}</b>${n===best&&d.list.length?' <span class="rk r1">1.</span>':''}<div class="tag">${eur(p.eur)} · ${p.first}× Platz 1</div></td>`:'<td class="pc muted">-</td>'}).join('')}
      <td class="pc"><b>${eur(d.paid)}</b></td></tr>`}).join('');
  showSheet(`<h1>Saisons</h1><div class="scroll"><table><thead><tr><th>Saison</th>${names.map(n=>`<th class="pc">${esc(n)}</th>`).join('')}<th class="pc">Alle Zahlungen</th></tr></thead><tbody>${rows}</tbody></table></div>
  <p class="muted">Zahl = verlorene Punkte in der Saison, darunter Zahlungen in € und Anzahl Spieltage auf Platz 1.${S.days.some(d=>d.imp)?' Spieltage nur mit Beträgen (z. B. aus Excel) zählen mit aus dem Betrag zurückgerechneten Punkten (≈).':''}</p>
  <label>Aktuelle Saison umbenennen</label><div class="row2"><input type="text" id="seasonRename" value="${esc(S.season.name)}"><button class="btn sec" onclick="renameSeason()">Umbenennen</button></div>
  <label>Neue Saison anlegen (die aktuelle wird abgeschlossen und gespeichert)</label><div class="row2"><input type="text" id="seasonNew" placeholder="Name der neuen Saison"><button class="btn" onclick="newSeason()">Neue Saison</button></div>
  ${S.pastSeasons.length?`<label>Aktuelle Saison in eine ältere übertragen (alle ihre Spieltage)</label><div class="row2"><select id="mergeTarget">${S.pastSeasons.slice().reverse().map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><button class="btn sec" onclick="mergeSeason()">Übertragen …</button></div>`:''}
  <p id="seasonMsg" class="lost"></p>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn sec" onclick="closeModal()">Schließen</button></div>`);
}
function renameSeason(){
  const v=document.getElementById('seasonRename').value.trim();
  if(v){S.season.name=v;save();openSeasons()}
}
function newSeason(){
  const name=document.getElementById('seasonNew').value.trim(),msg=document.getElementById('seasonMsg');
  if(!name){msg.textContent='Bitte einen Namen für die neue Saison eingeben.';return}
  if(S.hands.length){msg.textContent='Bitte zuerst den laufenden Spieltag abschließen.';return}
  S.pastSeasons.push({...S.season,end:new Date().toISOString()});
  S.season={id:Date.now(),name,start:new Date().toISOString()};
  VIEWSEASON=null;save();openSeasons();
}

/* ---------- Diagramme (SVG/HTML, ohne Bibliothek) ---------- */
let STATVIEW='charts';
const colVar=i=>`var(--c${(i%8)+1})`;
const nf=n=>Math.round(n).toLocaleString('de-DE');
function legendHTML(items,fmt){
  const tot=items.reduce((s,x)=>s+x.v,0);
  return `<div class="legend">${items.map(x=>`<span class="it"><i class="sw" style="background:${x.c}"></i>${esc(x.l)} <b>${fmt?fmt(x):nf(x.v)}</b>${tot&&x.pct!==false?` <span class="muted">${Math.round(100*x.v/tot)} %</span>`:''}</span>`).join('')}</div>`;
}
function donutSVG(items,aria,big,small){
  const tot=items.reduce((s,x)=>s+x.v,0);
  if(!tot)return '<p class="muted">Noch keine Daten.</p>';
  const cx=110,cy=110,R=100,r=60;let a0=-Math.PI/2,paths='';
  const pt=(a,rad)=>[(cx+rad*Math.cos(a)).toFixed(2),(cy+rad*Math.sin(a)).toFixed(2)];
  items.forEach(x=>{
    if(!x.v)return;
    const frac=x.v/tot,a1=a0+frac*2*Math.PI;let d;
    if(frac>=0.9999){d=`M${cx} ${cy-R}A${R} ${R} 0 1 1 ${cx-0.01} ${cy-R}L${cx-0.01} ${cy-r}A${r} ${r} 0 1 0 ${cx} ${cy-r}Z`}
    else{const [x0,y0]=pt(a0,R),[x1,y1]=pt(a1,R),[x2,y2]=pt(a1,r),[x3,y3]=pt(a0,r),lg=frac>.5?1:0;
      d=`M${x0} ${y0}A${R} ${R} 0 ${lg} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${lg} 0 ${x3} ${y3}Z`}
    paths+=`<path d="${d}" fill="${x.c}"><title>${esc(x.l)}: ${x.t||nf(x.v)} (${Math.round(frac*100)} %)</title></path>`;
    a0=a1;
  });
  return `<svg class="donut" viewBox="0 0 220 220" role="img" aria-label="${esc(aria)}">${paths}<text x="110" y="${small?108:118}" text-anchor="middle" font-size="22" font-weight="800">${esc(big)}</text>${small?`<text x="110" y="130" text-anchor="middle" font-size="12" style="fill:var(--mute)">${esc(small)}</text>`:''}</svg>`;
}
function hbarsHTML(rows,series,fmtRow){
  const max=Math.max(1,...rows.map(r=>r.vals.reduce((a,b)=>a+b,0)));
  return rows.map(r=>`<div class="hrow"><div class="nm" title="${esc(r.name)}">${esc(r.name)}</div><div><div class="hb">${r.vals.map((v,i)=>v?`<i style="width:${(100*v/max).toFixed(2)}%;background:${series[i].c}" title="${esc(r.name)} · ${esc(series[i].l)}: ${v}"></i>`:'').join('')}</div><div class="hv">${fmtRow(r)}</div></div></div>`).join('');
}
function lineSVG(labels,series,aria){
  const W=Math.max(290,Math.min(640,innerWidth-64)),H=250,L=44,Rr=12,T=12,B=34,n=labels.length;
  const mx=Math.max(1,...series.flatMap(s=>s.vals));
  const step=Math.pow(10,Math.floor(Math.log10(mx/4)));const nice=[1,2,2.5,5,10].map(k=>k*step).find(k=>mx/k<=5)||step*10;
  const top=Math.ceil(mx/nice)*nice;
  const X=i=>n<2?L+(W-L-Rr)/2:L+i*(W-L-Rr)/(n-1),Y=v=>T+(H-T-B)*(1-v/top);
  let g='';
  for(let v=0;v<=top+0.001;v+=nice){g+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--grid)" stroke-width="1"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end">${nf(v)}</text>`}
  const every=Math.ceil(n/Math.max(2,Math.floor((W-L)/62)));
  labels.forEach((l,i)=>{if((i%every===0&&(n-1-i>=every*0.6||i===0))||i===n-1)g+=`<text x="${X(i)}" y="${H-12}" text-anchor="middle">${esc(l)}</text>`});
  g+=`<line x1="${L}" x2="${W-Rr}" y1="${Y(0)}" y2="${Y(0)}" style="stroke:var(--mute)" stroke-width="1"/>`;
  series.forEach(s=>{
    g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" points="${s.vals.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}"/>`;
    // viele Spieltage: nur der letzte Punkt sichtbar, die anderen unsichtbar (Tooltip bleibt), sonst verdecken die Punkte die Linie
    s.vals.forEach((v,i)=>{const dot=n<=30||i===n-1;g+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${dot?4:3}" fill="${dot?s.c:'transparent'}" style="stroke:${dot?'var(--card)':'none'}" stroke-width="2"><title>${esc(s.name)} · ${esc(labels[i])}: ${nf(v)} Punkte</title></circle>`});
  });
  return `<svg class="linechart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">${g}</svg>`;
}
function statCharts(st,order,an,ramschHands,hasPl,hasGames,nImp){
  if(!order.length)return '<p class="muted">Keine Daten.</p>';
  const P=order.map((n,i)=>({n,c:colVar(i),s:st[n]}));
  const euroItems=P.map(p=>({l:p.n,v:p.s.eurTot,c:p.c,t:eur(p.s.eurTot)}));
  const ptsItems=P.map(p=>({l:p.n,v:p.s.punkte,c:p.c,t:nf(p.s.punkte)+' Punkte'}));
  const totE=euroItems.reduce((a,x)=>a+x.v,0),totP=ptsItems.reduce((a,x)=>a+x.v,0);
  const g=P.reduce((a,p)=>a+p.s.grand[0],0),f=P.reduce((a,p)=>a+p.s.farbe[0],0),nl=P.reduce((a,p)=>a+p.s.null[0],0);
  const artItems=[{l:'Grand',v:g,c:'var(--c1)'},{l:'Farbspiele',v:f,c:'var(--c2)'},{l:'Null',v:nl,c:'var(--c3)'},{l:'Ramsch',v:ramschHands,c:'var(--c4)'}].filter(x=>x.v>0);
  const wl=[{l:'Gewonnen',c:'var(--c1)'},{l:'Verloren',c:'var(--c2)'}];
  const wlRows=P.map(p=>({name:p.n,vals:[p.s.w,p.s.l],sp:p.s.sp}));
  let h='<div class="charts">';
  h+=`<div class="chartcard"><h3>Zahlungen je Spieler</h3><p class="muted">Anteil an den Gesamtzahlungen (mit Grundeinsatz)</p>${donutSVG(euroItems,'Zahlungen je Spieler',eur(totE),'gesamt')}${legendHTML(euroItems,x=>eur(x.v))}</div>`;
  h+=`<div class="chartcard"><h3>Verlorene Punkte${nImp?' (≈)':''}</h3><p class="muted">Anteil an allen verlorenen Punkten</p>${donutSVG(ptsItems,'Verlorene Punkte je Spieler',nf(totP),'Punkte')}${legendHTML(ptsItems,x=>nf(x.v))}</div>`;
  if(hasGames)h+=`<div class="chartcard"><h3>Spielarten</h3><p class="muted">Anzahl gespielter Spiele</p>${donutSVG(artItems,'Verteilung der Spielarten',String(artItems.reduce((a,x)=>a+x.v,0)),'Spiele')}${legendHTML(artItems)}</div>`;
  if(hasGames)h+=`<div class="chartcard"><h3>Als Alleinspieler</h3><p class="muted">Gewonnen und verloren je Spieler</p>${hbarsHTML(wlRows,wl,r=>`${r.vals[0]} gewonnen · ${r.vals[1]} verloren${r.sp?' · '+Math.round(100*r.vals[0]/r.sp)+' %':''}`)}${legendHTML(wl.map(x=>({...x,v:0})),x=>'').replace(/<b><\/b>/g,'')}</div>`;
  if(hasPl){
    const pl=[{l:'1. Platz',c:'var(--pl1)'},{l:'2. Platz',c:'var(--pl2)'},{l:'3. Platz',c:'var(--pl3)'},{l:'4. Platz',c:'var(--pl4)'}];
    const rows=P.map(p=>({name:p.n,vals:[p.s.pl[1],p.s.pl[2],p.s.pl[3],p.s.pl[4]]})).filter(r=>r.vals.some(v=>v));
    if(rows.length)h+=`<div class="chartcard"><h3>Platzierungen</h3><p class="muted">Spieltage je Platz (1. = wenigste Punkte)</p>${hbarsHTML(rows,pl,r=>r.vals.map((v,i)=>v?`${v}× ${i+1}.`:'').filter(Boolean).join(' · '))}${legendHTML(pl.map(x=>({...x,v:0})),x=>'').replace(/<b><\/b>/g,'')}</div>`;
  }
  if(an.length>=2){
    const years=new Set(an.map(a=>new Date(a.day.date).getFullYear()));  // über mehrere Jahre: Jahr mit anzeigen
    const labels=an.map(a=>a.day.current?'heute':new Date(a.day.date).toLocaleDateString('de-DE',years.size>1?{day:'numeric',month:'numeric',year:'2-digit'}:{day:'numeric',month:'numeric'}));
    const run={};order.forEach(n=>run[n]=0);
    const series=order.map((n,i)=>({name:n,c:colVar(i),vals:[]}));
    an.forEach(a=>{const ent=entries(a);series.forEach(s=>{const e=ent.find(x=>x.name===s.name);if(e)run[s.name]+=e.end;s.vals.push(run[s.name])})});
    h+=`<div class="chartcard wide"><h3>Punkteverlauf</h3><p class="muted">Verlorene Punkte${nImp?' (≈ bei Spieltagen nur mit Beträgen)':''}, über die Spieltage addiert</p>${lineSVG(labels,series,'Punkteverlauf je Spieler')}${legendHTML(series.map(s=>({l:s.name,v:s.vals[s.vals.length-1],c:s.c})),x=>nf(x.v))}</div>`;
  }
  return h+'</div>';
}

let STATSEL=null;
function openStats(sel){
  STATSEL=sel||STATSEL||(S.hands.length?'cur':'all');
  if(STATSEL==='cur'&&(!S.hands.length||!(viewSeason()==='all'||viewSeason()===S.season.id)))STATSEL='all';
  if(STATSEL[0]==='d'&&!daysOf(viewSeason(),false).some(d=>'d'+d.id===STATSEL))STATSEL='all';
  let days;
  if(STATSEL==='all')days=allDays(true);
  else if(STATSEL==='cur')days=[curDay()];
  else days=S.days.filter(d=>'d'+d.id===STATSEL);
  const an=days.map(analyze);
  let ramschHands=0;
  const st={},order=[];
  const get=n=>st[n]||(order.push(n),st[n]={days:0,pl:[0,0,0,0,0,0,0],punkte:0,sp:0,w:0,l:0,
    grand:[0,0,0],farbe:[0,0,0],null:[0,0,0],fc:{kreuz:0,pik:0,herz:0,karo:0},ramsch:0,ramschL:0,ramschP:0,dm:0,
    mit:0,ohne:0,mitB:0,ohneB:0,hand:0,ouvert:0,snA:0,swA:0,spitze:0,kontra:0,kontraW:0,re:0,veto:0,mal:0,malW:0,malL:0,malP:0,euro:0,eurTot:0,maxW:0,sumAug:0,nAug:0});
  an.forEach(a=>{
    const nm_=i=>a.day.players[i];
    a.ghosts.forEach(g=>{const s=get(g.name);s.days++;s.punkte+=g.end;s.euro+=g.pay.euro;s.eurTot+=g.pay.total});
    a.part.forEach(i=>{const s=get(nm_(i));s.days++;s.punkte+=a.end[i];s.euro+=a.pay[i].euro;s.eurTot+=a.pay[i].total;if(!a.day.current)s.pl[Math.min(a.rank[i],6)]++});
    a.R.rows.forEach(r=>{
      const h=r.h,c=r.c;
      if(c.open)return; // noch offene Spiele zählen nicht
      if(r.slot==='mal')Object.entries(c.pts).forEach(([k,v])=>{if(v>0)get(nm_(+k)).malP+=v});
      if(h.malPlayer!=null&&h.malPlayer!==''){
        const mp=+h.malPlayer,ms=get(nm_(mp));ms.mal++;
        // eigene Malenko-Aufgabe (auch bei Veto): keine Punkte = gewonnen, sonst verloren
        (c.pts[mp]||0)>0?ms.malL++:ms.malW++;
      }
      if(h.type==='ramsch'){
        ramschHands++;
        r.play.forEach(p=>get(nm_(p)).ramsch++);
        if(h.durchmarsch!=null&&h.durchmarsch!=='')get(nm_(+h.durchmarsch)).dm++;
        else r.play.forEach(p=>{if((c.pts[p]||0)>0){const s=get(nm_(p));s.ramschL++;s.ramschP+=c.pts[p]}});
        return;
      }
      const s=get(nm_(h.declarer));
      s.sp++;c.won?s.w++:s.l++;
      const g=h.type==='grand'?s.grand:h.type==='null'?s.null:s.farbe;
      g[0]++;g[c.won?1:2]++;
      if(s.fc[h.type]!=null)s.fc[h.type]++;
      if(h.type!=='null'){if(h.mo==='mit'){s.mit++;s.mitB+=h.n}else{s.ohne++;s.ohneB+=h.n}}
      if(h.hand||h.ouvert)s.hand++;if(h.ouvert)s.ouvert++;if(h.schnAng||h.schwarzAng||h.ouvert)s.snA++;if(h.schwarzAng||h.ouvert)s.swA++;
      if(h.spitze&&a.day.settings&&a.day.settings.spitze)s.spitze++;
      if(h.veto)s.veto++;
      const sf=STAGEF[stageOf(h)],bf=r.lv>0?2:1,lf=c.won?1:2;
      s.maxW=Math.max(s.maxW,c.value*sf*lf*bf);
      if(h.augenSp!=null&&h.augenSp!==''){s.sumAug+=+h.augenSp;s.nAug++}
      if(stageOf(h)>=1){(h.contra||[]).forEach(p=>{const t=get(nm_(p));t.kontra++;if(!c.won)t.kontraW++})}
      if(stageOf(h)>=2)s.re++;
    });
  });
  const hasPl=an.some(a=>!a.day.current);
  const nImp=an.filter(a=>a.day.imp).length,hasGames=an.length>nImp;
  const impNote=nImp?`<div class="banner orange" style="margin:10px 0 0">${nImp===an.length?'Alle '+nImp+' Spieltage haben':nImp+' von '+an.length+' Spieltagen haben'} nur Beträge (ohne Einzelspiele, z. B. aus Excel). Die Punkte sind aus den Beträgen zurückgerechnet (≈). ${hasGames?'Spielarten, Alleinspieler, Buben usw. zählen nur die Spieltage mit Einzelspielen.':'Auswertungen zu einzelnen Spielen gibt es dafür nicht.'}</div>`:'';
  const pct=(w,t)=>t?Math.round(100*w/t)+'%':'-';
  const sec=t=>`<tr class="sec"><th colspan="${order.length+1}">${t}</th></tr>`;
  let zi=0; // jede 2. Zeile dunkler
  const row=(l,f)=>`<tr class="${(zi++)%2?'z':''}"><td>${l}</td>${order.map(n=>`<td class="pc">${f(st[n])}</td>`).join('')}</tr>`;
  const body=[
    sec('Geld'),
    row('Verloren gesamt in € (ohne Grundeinsatz)',s=>`<b>${eur(s.euro)}</b>`),
    row('Zu zahlen gesamt in € (mit Grundeinsatz)',s=>`<b>${eur(s.eurTot)}</b>`),
    sec('Allgemein'),
    row('Spieltage',s=>s.days),
    hasPl?[1,2,3,4].map(p=>row(p+'. Platz (Spieltage)',s=>s.pl[p])).join(''):'',
    row('Verlorene Punkte gesamt'+(nImp?' (≈)':''),s=>`<b>${s.punkte}</b>`),
    row('Ø Punkte je Spieltag'+(nImp?' (≈)':''),s=>s.days?Math.round(s.punkte/s.days):'-'),
    ...(hasGames?[sec('Als Alleinspieler'),
    row('Spiele gesamt',s=>s.sp),row('gewonnen',s=>s.w),row('verloren',s=>s.l),row('Gewinnquote',s=>pct(s.w,s.sp)),
    sec('Grand'),row('gespielt',s=>s.grand[0]),row('gewonnen',s=>s.grand[1]),row('verloren',s=>s.grand[2]),
    sec('Farbspiele'),row('gespielt',s=>s.farbe[0]),row('gewonnen',s=>s.farbe[1]),row('verloren',s=>s.farbe[2]),
    row('Kreuz / Pik / Herz / Karo',s=>`${s.fc.kreuz} / ${s.fc.pik} / ${s.fc.herz} / ${s.fc.karo}`),
    sec('Null'),row('gespielt',s=>s.null[0]),row('gewonnen',s=>s.null[1]),row('verloren',s=>s.null[2]),
    sec('Ramsch'),row('mitgespielt',s=>s.ramsch),row('verloren',s=>s.ramschL),row('Verlustpunkte im Ramsch',s=>s.ramschP),row('Durchmarsch',s=>s.dm),
    sec('Buben'),row('Spiele „mit“',s=>s.mit),row('Buben „mit“ gezählt',s=>s.mitB),row('Spiele „ohne“',s=>s.ohne),row('Buben „ohne“ gezählt',s=>s.ohneB),
    sec('Ansagen und Sonstiges'),
    row('Hand / Ouvert',s=>`${s.hand} / ${s.ouvert}`),row('Schneider / Schwarz angesagt',s=>`${s.snA} / ${s.swA}`),
    S.settings.spitze||an.some(a=>a.day.settings&&a.day.settings.spitze)?row('Spitze',s=>s.spitze):'',
    row('Kontra gesagt (davon gewonnen)',s=>`${s.kontra} (${s.kontraW})`),row('Re gesagt',s=>s.re),
    row('Veto im Ramsch',s=>s.veto),
    sec('Malenko'),
    row('Eigene Aufgaben gesamt',s=>s.mal),row('Eigene Aufgaben gewonnen',s=>s.malW),row('Eigene Aufgaben verloren',s=>s.malL),
    row('Punkte verloren (alle Malenko-Spiele)',s=>s.malP),
    sec('Weitere'),
    row('Höchster Spielwert',s=>s.maxW||'-'),row('Ø Augen als Alleinspieler',s=>s.nAug?Math.round(s.sumAug/s.nAug):'-')]:[])
  ].join('');
  const totalPaid=an.reduce((s,a)=>s+entries(a).reduce((t,e)=>t+e.pay.total,0),0);
  const opts=[['all','Alle Spieltage'],...(S.hands.length&&(viewSeason()==='all'||viewSeason()===S.season.id)?[['cur','Laufender Spieltag']]:[]),...daysOf(viewSeason(),false).reverse().map(d=>['d'+d.id,'Spieltag '+fmtDate(d.date)])];
  showSheet(`<h1>Statistik</h1><div class="selrow">${seasonSelect('openStats')}<select onchange="openStats(this.value)">${opts.map(([v,l])=>`<option value="${v}" ${STATSEL===v?'selected':''}>${l}</option>`).join('')}</select></div>
  <p style="margin:10px 0 0"><b>Gesamtsumme aller Zahlungen: ${eur(totalPaid)}</b> <span class="muted">(Punktwert + Grundeinsatz aller Spieler)</span></p>${impNote}
  <div class="seg" style="margin:10px 0 0"><button class="${STATVIEW==='charts'?'on':''}" onclick="STATVIEW='charts';openStats()">📊 Diagramme</button><button class="${STATVIEW==='table'?'on':''}" onclick="STATVIEW='table';openStats()">📋 Tabelle</button></div>
  ${STATVIEW==='charts'?statCharts(st,order,an,ramschHands,hasPl,hasGames,nImp):(order.length?`<div class="statwrap"><table><thead><tr><th></th>${order.map(n=>`<th class="pc">${esc(n)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`:'<p class="muted">Keine Daten.</p>')}
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn sec" onclick="openOverview()">📋 Gesamtansicht</button><button class="btn sec" onclick="closeModal()">Schließen</button></div>`);
}

const exportName=()=>'skat-'+new Date().toISOString().slice(0,10)+'.json';

let dirHandle=null;
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('skat-fs',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbPut(k,v){const db=await idb();return new Promise((res,rej)=>{const s=db.transaction('kv','readwrite').objectStore('kv');const q=v===undefined?s.delete(k):s.put(v,k);q.onsuccess=()=>res();q.onerror=()=>rej(q.error)})}
async function idbGet(k){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}

async function pickDir(){
  if(androidApp()&&typeof androidApp().pickFolder!=='undefined'){androidApp().pickFolder();return} // Android: Ordnerauswahl des Systems
  let h=null;
  try{h=await window.showDirectoryPicker({mode:'readwrite',id:'skat'})}
  catch(e){
    if(e&&e.name==='AbortError')return; // Auswahl abgebrochen
    const n=e&&e.name,m=e&&e.message||'';
    if(n==='SecurityError'||/system files|contains|sicher|blocked/i.test(m))
      toast('Diesen Ordner sperrt der Browser (z. B. „Dokumente“, „Downloads“ oder „Desktop“ selbst). Lege darin einen Unterordner an, z. B. „Skat“, und wähle diesen.',9000);
    else if(n==='NotAllowedError')
      toast('Der Browser erlaubt den Ordnerzugriff hier nicht. Bitte in Chrome oder Edge am PC öffnen (nicht in einer eingebetteten Vorschau).',9000);
    else toast('Ordner konnte nicht gewählt werden ('+(n||'Fehler')+(m?': '+m:'')+'). Dateien landen weiter im Download-Ordner.',9000);
    return;
  }
  dirHandle=h;
  try{await idbPut('dir',h)}catch(e){toast('Ordner „'+h.name+'“ gewählt, gilt aber nur bis zum Schließen der Seite (Browser kann ihn nicht dauerhaft merken).',7000)}

function summaryText(day){
  const a=analyze(day);const ent=entries(a).sort((x,y)=>x.end-y.end);
  const tot=ent.reduce((s,e)=>s+e.pay.total,0);
  return ['♠ Skat – '+seasonName(day.season??S.season.id)+' – '+fmtDate(day.date)+' ('+gamesTxt(day)+')',
    ...ent.map((e,i)=>(i+1)+'. '+e.name+': '+(day.imp?'':e.end+' Punkte → ')+eur(e.pay.total)+(e.ghost?' (Schnitt, abwesend)':'')),
    'Alle Zahlungen: '+eur(tot)].join('\n');
}

// Testdaten: index.html#demo62 füllt den laufenden Spieltag mit 62 zufälligen Spielen (ersetzt den laufenden Spieltag!)
function fillDemo(count,np,silent){
  np=np||4;
  let seed=Date.now()%2147483646+1;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;const ri=n=>Math.floor(rnd()*n);
  S.started=true;S.n=np;S.players=NAMES.slice(0,np);S.events=[];S.startDealer=0;S.settings={...DEF,...FIX};S.hands=[];
  const farben=['karo','herz','pik','kreuz'];
  const split=play=>{const a=ri(70),b=ri(120-a),c=120-a-b,v=[a,b,c].sort(()=>rnd()-.5);const augen={};play.forEach((p,i)=>augen[p]=v[i]);return augen};
  for(let k=0;k<count;k++){
    const R=replay(),play=R.play;let h;
    if(R.forcedRamsch){
      h={type:'ramsch',augen:split(play),contra:[]};
      if(rnd()<.1){h={type:'grand',declarer:play[ri(play.length)],mo:'mit',n:1+ri(2),hand:true,veto:true,outcome:'W',augenSp:75,contra:[]}}
    }else{
      let type,decl=play[ri(play.length)],mal=null;
      if(R.mal){mal=R.mal.player;decl=mal;const g=R.mal.remaining[ri(R.mal.remaining.length)];type=g==='grand'?'grand':g==='ramsch'?'ramsch':farben[ri(4)]}
      else type=rnd()<.15?'grand':rnd()<.05?'null':farben[ri(4)];
      if(!R.mal&&rnd()<.04){h={type:'ramsch',augen:split(play),contra:[],passe:true}}
      else if(type==='ramsch')h={type:'ramsch',augen:split(play),contra:[],malPlayer:mal};
      else if(type==='null')h={type:'null',declarer:decl,outcome:rnd()<.6?'W':'L',contra:[],malPlayer:mal};
      else{
        const aug=15+ri(105);
        h={type,declarer:decl,mo:rnd()<.5?'mit':'ohne',n:1+ri(type==='grand'?3:4),hand:rnd()<.12,outcome:outFrom(aug,false),augenSp:aug,contra:[],malPlayer:mal,reiz:rnd()<.5?[18,20,22,24,27,30][ri(6)]:null};
        if(rnd()<.2){const opp=play.filter(x=>x!==decl);h.contra=[opp[ri(opp.length)]];h.stage=1+ri(3)}
      }
    }
    S.hands.push(h);
  }
  if(!silent)save();
}
// Testdaten: index.html#demoSaisons erzeugt 2 Saisons mit je 13 Spieltagen zu je mindestens 100 Spielen (ERSETZT ALLE vorhandenen Daten!)
function fillDemoSeasons(daysPer,minGames){
  daysPer=daysPer||13;minGames=minGames||100;
  const day0=new Date();day0.setHours(19,0,0,0);day0.setDate(day0.getDate()-7*(daysPer*2+1));
  S.days=[];S.pastSeasons=[];S.events=[];
  const seasonNames=['Saison 2025/26','Saison 2026/27'];
  let week=0;
  S.season={id:1001,name:seasonNames[0],start:day0.toISOString()};
  for(let s=0;s<2;s++){
    for(let d=0;d<daysPer;d++){
      const np=(d%5===4)?3:4;                      // gelegentlich nur zu dritt (der 4. bekommt den Schnitt)
      fillDemo(minGames+Math.floor(Math.random()*21),np,true);
      if(np===3){const absent=NAMES[(d+s)%4];S.players=NAMES.filter(n=>n!==absent)} // wechselnder Abwesender
      const date=new Date(day0);date.setDate(day0.getDate()+7*week++);
      S.days.push(JSON.parse(JSON.stringify({id:date.getTime(),season:S.season.id,date:date.toISOString(),players:S.players,hands:S.hands,events:S.events,startDealer:S.startDealer,n:S.n,settings:S.settings,stake:S.stake})));
    }
    if(s===0){
      const end=new Date(day0);end.setDate(day0.getDate()+7*(week-1));
      S.pastSeasons.push({...S.season,end:end.toISOString()});
      const st=new Date(end);st.setDate(st.getDate()+7);
      S.season={id:1002,name:seasonNames[1],start:st.toISOString()};
    }
  }
  resetDay();save();
}

const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const ymdParse=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]):null};
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'],WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];

// Datum aus Eingabe wie 24.10.2026, 24.10.26, 24.10. (aktuelles Jahr) oder 2026-10-24; sonst null
function parseDate(txt){
  const t=String(txt||'').trim();let y,m,d,x;
  if((x=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(t))){y=+x[1];m=+x[2];d=+x[3]}
  else if((x=/^(\d{1,2})\.\s*(\d{1,2})\.?\s*(\d{2}|\d{4})?$/.exec(t))){d=+x[1];m=+x[2];y=x[3]?(+x[3]<100?2000+ +x[3]:+x[3]):new Date().getFullYear()}
  else return null;
  const dt=new Date(y,m-1,d);if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==d)return null;
  return ymd(dt);
}

// Feiertage (Deutschland): bundesweit und regional (nicht in jedem Bundesland), Ostern nach Gauß/Anonymous-Gregorian
const _hol={};
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da)}
function holidays(y){
  if(_hol[y])return _hol[y];
  const H={},E=easter(y),add=(d,n,reg)=>{H[ymd(d)]={n,reg:!!reg}},off=k=>new Date(y,E.getMonth(),E.getDate()+k);
  add(new Date(y,0,1),'Neujahr');add(off(-2),'Karfreitag');add(off(0),'Ostersonntag');add(off(1),'Ostermontag');add(new Date(y,4,1),'Tag der Arbeit');
  add(off(39),'Christi Himmelfahrt');add(off(49),'Pfingstsonntag');add(off(50),'Pfingstmontag');add(new Date(y,9,3),'Tag der Deutschen Einheit');
  add(new Date(y,11,25),'1. Weihnachtstag');add(new Date(y,11,26),'2. Weihnachtstag');
  add(new Date(y,0,6),'Heilige Drei Könige',1);add(off(60),'Fronleichnam',1);add(new Date(y,7,15),'Mariä Himmelfahrt',1);add(new Date(y,9,31),'Reformationstag',1);add(new Date(y,10,1),'Allerheiligen',1);
  const n23=new Date(y,10,23);add(new Date(y,10,23-((n23.getDay()+7-3)%7||7)),'Buß- und Bettag',1); // Mittwoch vor dem 23.11.
  return _hol[y]=H;
}

const REPEATS=[['none','einmalig'],['weekly','jede Woche'],['biweekly','alle 2 Wochen'],['monthly','jeden Monat']];
const remText=m=>(REMINDERS.find(r=>r[0]===+m)||[0,'keine'])[1];

// alle Termin-Tage einer (wiederholten) Serie
function occurrences(a){
  const d0=ymdParse(a.date);if(!d0)return[];
  const n=a.repeat&&a.repeat!=='none'?Math.max(1,Math.min(+a.count||1,200)):1,out=[];
  for(let i=0;i<n;i++){
    const d=new Date(d0);
    if(a.repeat==='weekly')d.setDate(d0.getDate()+7*i);else if(a.repeat==='biweekly')d.setDate(d0.getDate()+14*i);
    else if(a.repeat==='monthly'){d.setMonth(d0.getMonth()+i,1);const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(d0.getDate(),last))}
    out.push(ymd(d));
  }
  return out;
}

function nextOcc(a,today){return occurrences(a).find(d=>d>=today)||null}
const todayStr=()=>ymd(new Date());

/* --- Verlauf --- */
const APPT_FIELDS=[['title','Titel',a=>a.title],['date','Datum',a=>dayLabel(a.date)],['start','Beginn',a=>a.allDay?'ganztägig':a.start||'–'],['end','Ende',a=>a.allDay?'–':a.end||'–'],['allDay','Ganztägig',a=>a.allDay?'ja':'nein'],['place','Ort',a=>a.place||'–'],['who','Teilnehmer',a=>(a.who||[]).join(', ')||'–'],['notes','Notizen',a=>a.notes||'–'],['remind','Erinnerung',a=>remText(a.remind)],['repeat','Wiederholung',a=>repText(a)],['count','Anzahl',a=>String(a.count||1)],['tentative','Status',a=>a.tentative?'vorläufig':'fest']];
function apptDiff(o,n){
  const ch=[];
  APPT_FIELDS.forEach(([k,l,f])=>{const x=JSON.stringify(o[k]??''),y=JSON.stringify(n[k]??'');if(x!==y){
    if(k==='start'&&o.allDay!==n.allDay)return; // Beginn/Ende ergeben sich aus „Ganztägig“
    if(k==='end'&&o.allDay!==n.allDay)return;
    if(k==='count'&&o.repeat==='none'&&n.repeat==='none')return;
    ch.push({f:l,from:f(o),to:f(n)})}});
  return ch;
}
function apptLogAdd(a,action,changes){
  S.apptLog.push({t:new Date().toISOString(),id:a.id,title:a.title,a:action,changes:changes||[],snap:action==='gelöscht'||action==='angelegt'?JSON.parse(JSON.stringify(a)):undefined});
}

/* --- Kalender-Datei (.ics, funktioniert in Android, iOS/iPhone und Windows/Outlook) --- */
const icsEsc=s=>String(s==null?'':s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n');
function icsFold(line){
  const enc=new TextEncoder();let out='',cur='',len=0;
  for(const ch of line){const b=enc.encode(ch).length;if(len+b>73){out+=cur+'\r\n ';cur='';len=1}cur+=ch;len+=b}
  return out+cur;
}
const icsDT=(date,time)=>date.replace(/-/g,'')+'T'+(time||'00:00').replace(':','')+'00';
function icsEvent(a,stamp){
  const L=['BEGIN:VEVENT','UID:'+a.id+'@skatlog.local','DTSTAMP:'+stamp,'SEQUENCE:'+(a.seq||0),'SUMMARY:'+icsEsc(a.title||'Skat-Abend')];
  if(a.allDay){const d=ymdParse(a.date),n=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);L.push('DTSTART;VALUE=DATE:'+a.date.replace(/-/g,''),'DTEND;VALUE=DATE:'+ymd(n).replace(/-/g,''))}
  else{
    let endDate=a.date;const st=a.start||'19:00',en=a.end||'';
    if(!en){const [h,m]=st.split(':').map(Number);const e=new Date(2000,0,1,h+3,m);endDate=e.getDate()>1?addDays(a.date,1):a.date;L.push('DTSTART:'+icsDT(a.date,st),'DTEND:'+icsDT(endDate,pad2(e.getHours())+':'+pad2(e.getMinutes())))}
    else{if(en<=st)endDate=addDays(a.date,1);L.push('DTSTART:'+icsDT(a.date,st),'DTEND:'+icsDT(endDate,en))}
  }
  if(a.place)L.push('LOCATION:'+icsEsc(a.place));
  const desc=[a.notes||'',(a.who&&a.who.length?'Mitspieler: '+a.who.join(', '):'')].filter(Boolean).join('\n');
  if(desc)L.push('DESCRIPTION:'+icsEsc(desc));
  L.push('STATUS:'+(a.tentative?'TENTATIVE':'CONFIRMED'),'TRANSP:OPAQUE','CATEGORIES:Skat');
  if(a.repeat&&a.repeat!=='none'){const f=a.repeat==='monthly'?'FREQ=MONTHLY;INTERVAL=1':a.repeat==='biweekly'?'FREQ=WEEKLY;INTERVAL=2':'FREQ=WEEKLY;INTERVAL=1';L.push('RRULE:'+f+';COUNT='+Math.max(1,+a.count||1))}
  if(+a.remind>0)L.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(a.title||'Skat-Abend'),'TRIGGER:-PT'+(+a.remind)+'M','END:VALARM');
  L.push('END:VEVENT');return L;
}
function buildIcs(list){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Skat-Log//Termine//DE','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:Skat-Termine'];
  list.forEach(a=>L.push(...icsEvent(a,stamp)));L.push('END:VCALENDAR');
  return L.map(icsFold).join('\r\n')+'\r\n';
}
function apptText(a){
  const occ=occurrences(a);
  return '♠ Skat-Termin: '+(a.title||'Skat-Abend')+'\n'+dayLabel(a.date)+' · '+timeText(a)+(a.place?'\nOrt: '+a.place:'')+(a.who&&a.who.length?'\nMitspieler: '+a.who.join(', '):'')+(occ.length>1?'\nWiederholung: '+repText(a):'')+(a.notes?'\n'+a.notes:'')+(a.tentative?'\n(vorläufig)':'');
}
// mode: 'cal' = in den Kalender des Geräts übernehmen, 'save' = Datei speichern, 'share' = Einladung teilen
async function icsOut(name,text,mode,msg){
  const A=androidApp();
  if(A){
    if(mode==='cal'&&typeof A.openCalendar!=='undefined'){A.openCalendar(name,text);return}
    if(mode==='share'){A.shareFile(name,text,msg||'');return}
    A.saveFile(name,text);return;
  }
  let file=null;try{file=new File([text],name,{type:'text/calendar'})}catch(e){}
  if((mode==='cal'||mode==='share')&&file&&navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share(mode==='share'?{files:[file],title:'Skat-Termin',text:msg||''}:{files:[file],title:'Skat-Termin'});return}catch(e){if(e&&e.name==='AbortError')return}
  }
  if(mode==='share'&&msg&&!(file&&navigator.canShare)){sendTextWhatsApp(msg)}
  await saveText(name,text,'text/calendar');
  if(mode==='cal')toast('Datei gespeichert: '+name+' – zum Eintragen im Kalender öffnen (Doppelklick bzw. antippen).',7000);
}
const apptFile=a=>'skat-termin-'+a.date+'.ics';
function exportAppt(id,mode){const a=S.appts.find(x=>x.id===id);if(!a)return;icsOut(apptFile(a),buildIcs([a]),mode,apptText(a))}
function waAppt(id){
  const t=todayStr(),list=id?S.appts.filter(a=>a.id===id):S.appts.filter(a=>occurrences(a).some(d=>d>=t)).sort(apptSort);
  if(!list.length){toast('Keine kommenden Termine vorhanden');return}
  waDialog({title:'Einladung',text:list.map(apptText).join('\n\n'),name:id?apptFile(list[0]):'skat-termine.ics',content:buildIcs(list),mime:'text/calendar'});
}
function exportAllAppts(mode){
  const t=todayStr(),list=S.appts.filter(a=>occurrences(a).some(d=>d>=t)).sort(apptSort);
  if(!list.length){toast('Keine kommenden Termine vorhanden');return}
  icsOut('skat-termine.ics',buildIcs(list),mode,list.map(apptText).join('\n\n'));
}

/* --- Anzeige: Terminliste --- */
const apptHead=()=>`<div style="display:flex;gap:8px;flex-wrap:wrap;margin:8px 0"><button class="btn" onclick="openApptForm(null)">＋ Neuer Termin</button><button class="btn sec" onclick="openApptLog()">🕘 Verlauf</button></div>`;
function apptCard(a,past){
  const t=todayStr(),nx=past?a.date:(nextOcc(a,t)||a.date),h=holidayOf(nx),ser=occurrences(a).length>1;
  return `<div class="appt ${past?'past':''}"><div class="ad"><b>${esc(dayLabel(nx))}</b> · ${esc(timeText(a))}${a.tentative?' <span class="chip">vorläufig</span>':''}${h?` <span class="chip hol">${esc(h.n)}</span>`:''}</div>
  <div class="at">${esc(a.title||'Skat-Abend')}</div>
  <div class="muted">${a.place?'📍 '+esc(a.place)+' · ':''}${a.who&&a.who.length?'👥 '+esc(a.who.join(', '))+' · ':''}${ser?'↻ '+esc(repText(a))+' (ab '+esc(fmtDE(a.date))+') · ':''}${+a.remind?'🔔 '+esc(remText(a.remind)):''}</div>
  ${a.notes?`<div class="muted">${esc(a.notes)}</div>`:''}
  <div class="arow"><button class="btn sec" onclick="openApptForm('${a.id}')">✏ Ändern / verschieben</button><button class="btn sec" onclick="openApptExport('${a.id}')">📅 Kalender</button><button class="btn sec" onclick="openApptLog('${a.id}')">🕘</button><button class="btn sec" onclick="delAppt('${a.id}')">🗑</button></div></div>`;
}
function openAppts(){
  apptEnsure();
  const t=todayStr(),up=S.appts.filter(a=>occurrences(a).some(d=>d>=t)).sort((a,b)=>(nextOcc(a,t)+(a.start||'')).localeCompare(nextOcc(b,t)+(b.start||''))),
    past=S.appts.filter(a=>!occurrences(a).some(d=>d>=t)).sort((a,b)=>apptSort(b,a));
  showSheet(`<h1>📅 Termine</h1><p class="muted">Geplante Spieltermine. Jeder Termin lässt sich als Kalender-Datei (.ics) in den Kalender von Android, iPhone/iPad oder Windows übernehmen. Änderungen werden im Verlauf festgehalten.</p>
  ${apptHead()}
  ${up.length?`<h3>Kommende Termine (${up.length})</h3>`+up.map(a=>apptCard(a,false)).join(''):'<div class="banner">Noch kein kommender Termin. Mit „＋ Neuer Termin“ legst du einen an.</div>'}
  ${up.length?`<div style="margin:8px 0"><button class="btn sec" onclick="openApptExport()">📅 Alle kommenden Termine in den Kalender …</button></div>`:''}
  ${past.length?`<details style="margin-top:10px"><summary>Vergangene Termine (${past.length})</summary>${past.map(a=>apptCard(a,true)).join('')}</details>`:''}
  <div style="margin-top:12px"><button class="btn sec" onclick="closeModal()">Schließen</button></div>`);
}
function openApptExport(id){
  const one=id?S.appts.find(a=>a.id===id):null;
  const fn=id?`'${id}'`:'';
  showSheet(`<h1>📅 ${one?'In den Kalender':'Alle Termine in den Kalender'}</h1>
  <p class="muted">${one?esc(one.title||'Skat-Abend')+' · '+esc(dayLabel(one.date))+' · '+esc(timeText(one)):'Alle kommenden Termine in einer Datei.'}</p>
  <div style="display:flex;flex-direction:column;gap:8px;margin:8px 0">
  <button class="btn" onclick="${id?`exportAppt(${fn},'cal')`:`exportAllAppts('cal')`}">📅 In Kalender übernehmen</button>
  <button class="btn" onclick="${id?`waAppt('${id}')`:`waAppt()`}">💬 Einladung an WhatsApp senden (Text + Datei)</button>
  <button class="btn sec" onclick="${id?`exportAppt(${fn},'share')`:`exportAllAppts('share')`}">✉ Einladung senden (Mail, andere Apps …)</button>
  <button class="btn sec" onclick="${id?`exportAppt(${fn},'save')`:`exportAllAppts('save')`}">💾 Nur Datei speichern (.ics)</button></div>
  <p class="muted"><b>Android:</b> „In Kalender übernehmen“ öffnet die Kalender-App. <b>iPhone/iPad:</b> die .ics-Datei antippen und „Zum Kalender hinzufügen“ wählen (Teilen-Menü, Dateien oder Mail). <b>Windows:</b> die Datei doppelklicken, sie öffnet sich im Kalender (Outlook) und wird dort gespeichert. Wird ein Termin später geändert und die Datei erneut geöffnet, aktualisiert der Kalender den vorhandenen Eintrag.</p>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec" onclick="openAppts()">← Zurück zu den Terminen</button></div>`);
}
function delAppt(id){
  const a=S.appts.find(x=>x.id===id);if(!a)return;
  ask('Termin „'+esc(a.title||'Skat-Abend')+'“ am '+esc(dayLabel(a.date))+' löschen? Er bleibt im Verlauf sichtbar.','Ja, Termin löschen',()=>{
    S.appts=S.appts.filter(x=>x.id!==id);apptLogAdd(a,'gelöscht',[]);save();openAppts();toast('Termin gelöscht (im Verlauf nachlesbar)');
  });
}

/* --- Formular mit Kalender --- */
let AF=null;
function newApptId(){return 'a'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function nextSaturday(){const d=new Date();d.setDate(d.getDate()+((6-d.getDay()+7)%7||7));return ymd(d)}
function openApptForm(id){
  const a=id?S.appts.find(x=>x.id===id):null;
  const last=S.appts.length?S.appts[S.appts.length-1]:null;
  // neuer Termin: alle Mitspieler angewählt, Beginn 17:00, Ort wie beim letzten Termin
  const all=[...new Set([...NAMES,...S.players.slice(0,S.n)])].filter(n=>S.nameList.includes(n));
  AF=a?JSON.parse(JSON.stringify(a)):{id:null,title:'Skat-Abend',date:nextSaturday(),start:'17:00',end:'23:00',allDay:false,place:last?last.place||'':'',who:all,notes:'',remind:60,repeat:'none',count:10,tentative:false};
  if(AF.allDay){AF.allDay=false;AF.start=AF.start||'17:00';AF.end=AF.end||'23:00'} // „Ganztägig“ gibt es im Formular nicht mehr
  AF.who=AF.who||[];AF._orig=a?JSON.parse(JSON.stringify(a)):null;
  const d=ymdParse(AF.date)||new Date();AF._y=d.getFullYear();AF._m=d.getMonth();
  drawApptForm();
}
function drawApptForm(){
  const a=AF,names=AF._names=[...new Set([...(S.nameList||[]),...(AF.who||[])])];
  showSheet(`<h1>${a._orig?'Termin ändern / verschieben':'Neuer Termin'}</h1>
  <label>Titel</label><input type="text" id="afTitle" value="${esc(a.title)}" oninput="AF.title=this.value">
  <label>Datum</label>
  <div class="row2"><input type="text" id="afDate" inputmode="numeric" placeholder="TT.MM.JJJJ" value="${esc(fmtDE(a.date))}" oninput="apptDateTyped(this.value)"><div class="datelab" id="afDay">${esc(dayLabelHol(a.date))}</div></div>
  <div id="calBox">${calHTML()}</div>
  ${`<div class="row2"><div><label>Beginn</label><input type="time" id="afStart" value="${esc(a.start||'')}" oninput="AF.start=this.value"></div><div><label>Ende</label><input type="time" id="afEnd" value="${esc(a.end||'')}" oninput="AF.end=this.value"></div></div><div class="muted">Liegt das Ende vor dem Beginn, endet der Termin am nächsten Tag.</div>`}
  <label>Ort</label>${(()=>{const opts=names.map(n=>'bei '+n),custom=!!a.place&&!opts.includes(a.place);
    return `<select id="afPlaceSel" onchange="apptPlace(this.value)"><option value="">– kein Ort –</option>${opts.map(o=>`<option value="${esc(o)}" ${a.place===o?'selected':''}>${esc(o)}</option>`).join('')}<option value="__new" ${custom?'selected':''}>Anderer Ort …</option></select><input type="text" id="afPlace" style="margin-top:6px;${custom?'':'display:none'}" value="${custom?esc(a.place):''}" placeholder="Anderer Ort, z. B. Gasthaus Krone" oninput="AF.place=this.value">`})()}
  <label>Mitspieler</label>
  <div class="whobox">${names.map((n,i)=>`<label class="chk"><input type="checkbox" ${a.who.includes(n)?'checked':''} onchange="apptWho(${i},this.checked)"> ${esc(n)}</label>`).join('')}</div>
  <div class="row2"><input type="text" id="afWho" placeholder="Weiterer Name" style="min-width:0"><button class="btn sec" onclick="apptAddWho()">＋ Hinzufügen</button></div>
  <div class="row2"><div><label>Erinnerung</label><select onchange="AF.remind=+this.value">${REMINDERS.map(r=>`<option value="${r[0]}" ${+a.remind===r[0]?'selected':''}>${r[1]}</option>`).join('')}</select></div>
  <div><label>Wiederholung</label><select onchange="AF.repeat=this.value;drawApptForm()">${REPEATS.map(r=>`<option value="${r[0]}" ${a.repeat===r[0]?'selected':''}>${r[1]}</option>`).join('')}</select></div></div>
  ${a.repeat&&a.repeat!=='none'?`<label>Anzahl der Termine (mit dem ersten)</label><input type="number" min="2" max="200" value="${a.count||10}" oninput="AF.count=Math.max(2,Math.min(200,+this.value||2))">`:''}
  <label class="chk"><input type="checkbox" ${a.tentative?'checked':''} onchange="AF.tentative=this.checked"> Vorläufig (noch nicht fest)</label>
  <label>Notizen</label><textarea id="afNotes" rows="3" oninput="AF.notes=this.value">${esc(a.notes)}</textarea>
  <div id="afMsg" class="banner orange" style="display:none"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0"><button class="btn" onclick="saveAppt()">💾 ${a._orig?'Änderung speichern':'Termin speichern'}</button><button class="btn sec" onclick="openAppts()">Abbrechen</button></div>`);
}
const dayLabelHol=s=>{const h=holidayOf(s);return s?dayLabel(s)+(h?' · '+h.n+(h.reg?' (regional)':''):''):'Datum ungültig'};
function apptDateTyped(v){
  const s=parseDate(v);
  AF._bad=!s;
  if(s){AF.date=s;const d=ymdParse(s);AF._y=d.getFullYear();AF._m=d.getMonth();document.getElementById('calBox').innerHTML=calHTML()}
  document.getElementById('afDay').textContent=s?dayLabelHol(s):'Datum ungültig';
}
function apptPlace(v){
  const el=document.getElementById('afPlace');
  if(v==='__new'){AF.place=el.value;el.style.display='';el.focus()}
  else{AF.place=v;el.style.display='none'}
}
function apptWho(k,on){const n=AF._names[k],w=AF.who,i=w.indexOf(n);if(on&&i<0)w.push(n);if(!on&&i>=0)w.splice(i,1)}
function apptAddWho(){const el=document.getElementById('afWho'),n=(el.value||'').trim();if(!n)return;if(!AF.who.includes(n))AF.who.push(n);if(!S.nameList.includes(n)){S.nameList.push(n);save()}drawApptForm()}
function calHTML(){
  const y=AF._y,m=AF._m,first=new Date(y,m,1),lead=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate(),t=todayStr(),H=holidays(y);
  const hm=[];
  let cells='';
  for(let i=0;i<lead;i++)cells+='<span class="cd empty"></span>';
  for(let d=1;d<=days;d++){
    const s=y+'-'+pad2(m+1)+'-'+pad2(d),dt=new Date(y,m,d),wd=dt.getDay(),h=H[s],ap=apptOn(s).filter(x=>!AF.id||x.id!==AF.id).length;
    if(h)hm.push(pad2(d)+'.'+pad2(m+1)+'. '+h.n+(h.reg?' (regional)':''));
    const cls=['cd',wd===6?'sat':'',wd===0?'sun':'',h?(h.reg?'hol reg':'hol'):'',s===AF.date?'sel':'',s===t?'today':'',ap?'has':''].filter(Boolean).join(' ');
    cells+=`<button type="button" class="${cls}" onclick="calPick('${s}')" title="${esc(dayLabel(s)+(h?' · '+h.n:''))}">${d}</button>`;
  }
  const on=apptOn(AF.date).filter(x=>!AF.id||x.id!==AF.id);
  return `<div class="cal"><div class="calnav"><button type="button" class="btn sec" onclick="calNav(-12)" aria-label="Vorheriges Jahr">«</button><button type="button" class="btn sec" onclick="calNav(-1)" aria-label="Vorheriger Monat">‹</button><b>${MONTHS[m]} ${y}</b><button type="button" class="btn sec" onclick="calNav(1)" aria-label="Nächster Monat">›</button><button type="button" class="btn sec" onclick="calNav(12)" aria-label="Nächstes Jahr">»</button></div>
  <div class="calgrid"><span class="cw">Mo</span><span class="cw">Di</span><span class="cw">Mi</span><span class="cw">Do</span><span class="cw">Fr</span><span class="cw sat">Sa</span><span class="cw sun">So</span>${cells}</div>
  <div class="callegend"><span><i class="lg sat"></i>Samstag</span><span><i class="lg sun"></i>Sonntag</span><span><i class="lg hol"></i>Feiertag</span><span><i class="lg has"></i>Termin vorhanden</span><button type="button" class="btn sec" onclick="calToday()">Heute</button></div>
  ${hm.length?`<div class="muted calhol">Feiertage: ${esc(hm.join(' · '))}</div>`:''}
  ${on.length?`<div class="banner orange">An diesem Tag gibt es schon: ${esc(on.map(x=>(x.title||'Skat-Abend')+' ('+timeText(x)+')').join(', '))}</div>`:''}</div>`;
}
function calNav(k){const d=new Date(AF._y,AF._m+k,1);AF._y=d.getFullYear();AF._m=d.getMonth();document.getElementById('calBox').innerHTML=calHTML()}
function calToday(){const d=new Date();AF._y=d.getFullYear();AF._m=d.getMonth();document.getElementById('calBox').innerHTML=calHTML()}
function calPick(s){
  AF.date=s;AF._bad=false;document.getElementById('afDate').value=fmtDE(s);document.getElementById('afDay').textContent=dayLabelHol(s);
  document.getElementById('calBox').innerHTML=calHTML();
}
function saveAppt(){
  const msg=t=>{const e=document.getElementById('afMsg');e.style.display='';e.textContent=t;e.scrollIntoView({block:'nearest'})};
  const a=AF;
  if(!(a.title||'').trim())return msg('Bitte einen Titel eingeben.');
  if(AF._bad||!ymdParse(a.date))return msg('Das Datum ist ungültig. Bitte als TT.MM.JJJJ eingeben oder im Kalender wählen.');
  if(!a.allDay&&!/^\d{2}:\d{2}$/.test(a.start||''))return msg('Bitte einen Beginn (Uhrzeit) eingeben.');
  const n={id:a.id||newApptId(),title:a.title.trim(),date:a.date,allDay:!!a.allDay,start:a.allDay?'':a.start,end:a.allDay?'':(a.end||''),place:(a.place||'').trim(),who:[...a.who],notes:(a.notes||'').trim(),remind:+a.remind||0,repeat:a.repeat||'none',count:a.repeat&&a.repeat!=='none'?Math.max(2,+a.count||2):1,tentative:!!a.tentative};
  const now=new Date().toISOString();
  if(a._orig){
    const ch=apptDiff(a._orig,n);
    if(!ch.length){openAppts();toast('Keine Änderung');return}
    n.seq=(a._orig.seq||0)+1;n.created=a._orig.created;n.updated=now;
    const moved=ch.some(c=>c.f==='Datum'||c.f==='Beginn'||c.f==='Ende');
    S.appts=S.appts.map(x=>x.id===n.id?n:x);apptLogAdd(n,moved?'verschoben':'geändert',ch);
  }else{
    n.seq=0;n.created=now;n.updated=now;S.appts.push(n);apptLogAdd(n,'angelegt',[]);
  }
  save();AF=null;openAppts();toast('Termin gespeichert');
}

/* --- Verlauf --- */
function openApptLog(id){
  apptEnsure();
  const list=S.apptLog.filter(l=>!id||l.id===id).slice().reverse();
  const icon={angelegt:'➕',geändert:'✏',verschoben:'↔',gelöscht:'🗑'};
  const fdt=t=>{const d=new Date(t);return fdate(d)};

let _wa=null;
function waDialog(o){_wa={...o,step:0};drawWa()}
function drawWa(){
  const o=_wa,hasFile=!!o.name;
  showSheet(`<h1>💬 An WhatsApp senden</h1><p class="muted">${hasFile?'In zwei Schritten: erst die Nachricht, dann die Datei.':'Die Nachricht wird an WhatsApp übergeben.'} Im WhatsApp-Fenster wählst du den Chat oder die Gruppe.</p>
  <label>${esc(o.title||'Nachricht')}</label><pre class="wapre">${esc(o.text)}</pre>
  <div style="display:flex;flex-direction:column;gap:8px;margin:10px 0">
  <button class="btn" id="waStep1" onclick="waStep(1)">${o.step>=1?'✔':'①'} Nachricht an WhatsApp senden</button>
  ${hasFile?`<button class="btn ${o.step>=1?'':'sec'}" id="waStep2" onclick="waStep(2)">${o.step>=2?'✔':'②'} Datei senden: ${esc(o.name)}</button>`:''}</div>
  <p class="muted">${hasFile?'Nach Schritt ① kommst du hierher zurück und sendest mit ② die Datei in denselben Chat. ':''}Ohne WhatsApp auf dem Gerät öffnet sich stattdessen das allgemeine Teilen-Menü bzw. WhatsApp im Browser.</p>
  <button class="btn sec" onclick="closeModal()">${o.step>=(hasFile?2:1)?'Fertig':'Abbrechen'}</button>`);
}
async function waStep(n){
  const o=_wa;if(!o)return;
  const A=androidApp();
  if(n===1){
    if(A&&typeof A.shareWhatsApp!=='undefined')A.shareWhatsApp('','',o.text);
    else if(A)A.shareText(o.text);
    else window.open('https://wa.me/?text='+encodeURIComponent(o.text),'_blank');
  }else{
    if(A&&typeof A.shareWhatsApp!=='undefined')A.shareWhatsApp(o.name,o.content,'');
    else if(A)A.shareFile(o.name,o.content,'');
    else{
      let done=false;
      try{const f=new File([o.content],o.name,{type:o.mime||'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:o.name});done=true}}catch(e){if(e&&e.name==='AbortError')return}
      if(!done){await saveText(o.name,o.content,o.mime);toast('Datei gespeichert: '+o.name+' – in WhatsApp über die Büroklammer anhängen.',8000)}
    }
  }
  o.step=Math.max(o.step,n);if(document.getElementById('modal').innerText.includes('An WhatsApp senden'))drawWa();
}

<li><b>+ Spiel anlegen:</b> Sobald gereizt und angesagt ist, legst du das Spiel an (Spielart, Alleinspieler, Reizwert, Ansagen, Kontra). Das Ergebnis folgt nach dem Spiel.</li>

{id:'spieler',t:'Spieler, Geber, Reihenfolge',h:`<p>3 oder 4 Spieler. Bei 4 Spielern setzt der Geber aus. Der erste eingetragene Spieler gibt zuerst, danach reihum. Ein dicker Strich in der Spielübersicht zeigt, wo der 1. Geber wieder beginnt.</p>`},
{id:'spielarten',t:'Spielarten und Grundwerte',h:`<table><thead><tr><th>Spiel</th><th>Grundwert</th></tr></thead><tbody>
<tr><td>Karo</td><td>9</td></tr><tr><td>Herz</td><td>10</td></tr><tr><td>Pik</td><td>11</td></tr><tr><td>Kreuz</td><td>12</td></tr><tr><td>Grand</td><td>24</td></tr>
<tr><td>Null</td><td>23</td></tr><tr><td>Null Hand</td><td>35</td></tr><tr><td>Null Ouvert</td><td>46</td></tr><tr><td>Null Ouvert Hand</td><td>59</td></tr></tbody></table>
<p>Optional „Spitze“ (Einstellungen): umgekehrte Rangfolge, die 7 ist Trumpf. Das verdoppelt den Grundwert, nur bei Farb- und Grandspielen.</p>`},
{id:'spielwert',t:'Spielwert berechnen',h:`<p><b>Spielwert = Grundwert × Multiplikator</b> (Farbe und Grand).</p>
<p>Multiplikator = Buben (mit/ohne 1 bis 11, im Grand 1 bis 4) + 1 (Spiel gespielt) + je +1 für: Hand, Schneider, Schneider angesagt, Schwarz, Schwarz angesagt, Ouvert.</p>

<li><b>Überreizen:</b> Ist der Spielwert kleiner als der Reizwert, ist das Spiel verloren. Es zählt das kleinste Vielfache des Grundwerts, das den Reizwert erreicht.</li></ul>`},
{id:'kontra',t:'Kontra, Re, Hirsch, Geweih',h:`<table><thead><tr><th>Ansage</th><th>Von</th><th>Faktor</th></tr></thead><tbody>
<tr><td>Kontra</td><td>Gegner</td><td>×2</td></tr><tr><td>Re</td><td>Alleinspieler</td><td>×4</td></tr><tr><td>Hirsch</td><td>Gegner</td><td>×8</td></tr><tr><td>Geweih</td><td>Alleinspieler</td><td>×16</td></tr></tbody></table>
<p>Sie folgen nacheinander: Re geht erst nach Kontra, Hirsch nach Re, Geweih nach Hirsch. In einer Bockrunde kommt zusätzlich ×2 dazu.</p>`},
{id:'wertung',t:'Wertung: verlorene Punkte',h:`<p>Die App schreibt <b>Verlustpunkte</b> auf. Unter jedem Namen steht die Summe.</p>

<li><b>Alleinspieler gewinnt:</b> alle anderen Mitspieler bekommen den Spielwert × Faktoren, bei 4 Spielern auch der aussetzende Geber. Der Alleinspieler bekommt nichts. (Abschaltbar in den Einstellungen.)</li></ul>
<p>Beispiel: Kreuz mit 1 und Hand (36), verloren, Bockrunde: 36 × 2 (verloren) × 2 (Bock) = 144 Punkte.</p>`},
{id:'bock',t:'Bock-/Ramschrunden',h:`<ul><li>Eine <b>Bock-/Ramschrunde</b> besteht aus N Bock-Spielen (alle Werte ×2) und danach N Ramsch-Spielen (N = Spieleranzahl).</li>
<li>Ein Spieltag beginnt mit <b>N solchen Runden</b>, bei 4 Spielern also 4 Runden mit 32 Spielen.</li>
<li>Verliert ein Alleinspieler ein Spiel mit Kontra oder höher, oder verliert er mit genau 60 Augen (auch ohne Kontra, nicht bei Null), wird eine weitere Runde angehängt. Die App weist mit einem Hinweis darauf hin, den du mit „Gelesen“ bestätigst.</li>
<li>Im Ramsch-Teil darf nur Ramsch gespielt werden, außer ein Spieler sagt Grand Hand an (<b>Veto</b>): Dann spielt dieser Spieler Grand Hand und das Ramsch-Spiel wird nachgeholt.</li>
<li><b>Alle passen:</b> Dann werden N Ramsch-Spiele gespielt (Pflicht-Ramsch).</li>
<li>Sind keine Runden mehr offen, läuft Malenko.</li></ul>`},
{id:'ramsch',t:'Ramsch',h:`<ul><li>Jeder spielt für sich, nur Buben sind Trumpf. Wer die meisten Augen hat, verliert. Gleichstand: alle Gleichen verlieren voll.</li>
<li>Die verlorenen Punkte sind die Augen, <b>auf die nächste 10 gerundet</b> (55 → 60, 54 → 50). In der Bockrunde ×2.</li>
<li><b>Jungfrau:</b> Hat ein Spieler 0 Augen, kann Jungfrau gewählt werden. Dann zählt der Verlust ×2.</li>
<li><b>Durchmarsch:</b> Ein Spieler hat 120 Augen und alle Stiche. Alle anderen bekommen je 120. Hat der Spieler 120 Augen, aber ein Mitspieler einen Stich mit 0 Punkten, ist es kein Durchmarsch, sondern Jungfrau.</li>
<li>Die Augen aller Spieler ergeben zusammen 120 (inklusive Skat).</li></ul>`},
{id:'malenko',t:'Malenko',h:`<ul><li>Malenko läuft, wenn keine Bock-/Ramschrunde mehr offen ist.</li>
<li>Jeder Spieler muss drei verschiedene Spiele spielen: <b>G</b> = Grand, <b>R</b> = Ramsch, <b>F</b> = Farbspiel. Reihum spielt immer ein Spieler ein Spiel. Gespielte Arten sind rot durchkreuzt, offene grün.</li>
<li>Bei Malenko wird nicht gereizt, es gibt keinen Bock und kein „alle gepasst“.</li>
<li>Im Malenko-Ramsch dürfen die anderen Spieler Veto einlegen (Grand Hand). Die Ramsch-Aufgabe des Malenko-Spielers gilt dann als erledigt.</li>
<li>Haben alle alle drei Arten gespielt und ist das letzte Spiel beendet, beginnt die nächste Malenko-Runde.</li>
<li>Eine eigene Aufgabe zählt als gewonnen, wenn der Spieler keine Punkte bekommt, sonst als verloren.</li></ul>`},
{id:'wechsel',t:'Mitspieler kommen und gehen',h:`<ul><li>Ein Wechsel ist nur zwischen den Runden möglich, nicht mitten in einer Bock-/Ramsch- oder Malenko-Runde und nicht, solange ein Spiel läuft.</li>
<li><b>Neuer Mitspieler:</b> steht ganz rechts, startet mit dem Schnitt der Punkte der anderen und gibt zuletzt. Noch nicht begonnene Runden laufen dann mit 4 Bock- und 4 Ramsch-Spielen.</li>
<li><b>Spieler geht:</b> sein Stand bleibt stehen. Am Ende kommt der Schnitt der Punkte dazu, die die übrigen seitdem bekommen haben.</li>
<li><b>Nur zu dritt:</b> Der nicht anwesende Stammspieler (Guido, Karsten, Martin, Peter) bekommt den Schnitt der Punkte und die daraus folgenden Euro.</li></ul>`},
{id:'geld',t:'Abrechnung in Euro',h:`<p><b>Zu zahlen = Punkte ÷ 100 × Wert von 100 Punkten, aufgerundet auf volle Euro, plus Grundeinsatz.</b></p>
<p>Beispiel: 288 Punkte bei 0,50 € je 100 Punkte = 1,44 €, aufgerundet 2 €, plus 25 € Grundeinsatz = 27 €. Grundeinsatz und Punktwert stellst du unter Einstellungen ein, der letzte Wert bleibt erhalten.</p>`},
{id:'auswertung',t:'Saisons, Gesamtansicht, Statistik',h:`<ul><li>Eine <b>Saison</b> fasst viele Spieltage zusammen. Mit „Neue Saison“ (Saisons) beginnst du eine neue mit eigenem Namen, die alte bleibt in der Statistik erhalten.</li>
<li>Die <b>Gesamtansicht</b> zeigt alle Spieltage mit Punkten, Platz (1. = wenigste Punkte) und Zahlungen. Mit „🗑“ löschst du einen Spieltag, in „Saisons“ mit „🗑 Saison löschen“ eine ganze Saison mit allen ihren Spieltagen. Beides verlangt <b>zwei Rückfragen</b>. Sichere vorher über „Export“.</li>
<li>Die <b>Statistik</b> zeigt je Spieler: Spiele, Gewinnquote, Grand/Farbe/Null, Ramsch, Buben, Ansagen, Malenko, Geld. Wählbar für einen Spieltag, eine Saison oder alle.</li></ul>`},
{id:'daten',t:'Daten sichern, senden, rückgängig',h:`<ul><li>Alle Daten liegen lokal im Browser. Sichere sie regelmäßig über <b>Export / Senden → Als Datei speichern</b>.</li>
<li><b>Senden an …</b> öffnet das Teilen-Menü deines Geräts (z. B. WhatsApp-Gruppe) mit Ergebnis und Datendatei.</li>
<li><b>Import</b> lädt eine gespeicherte Datei und ersetzt die aktuellen Daten.</li>
<li><b>↶ Rückgängig</b> gilt, solange die Seite offen ist.</li></ul>`}

function handSummary(a,r){
  const h=r.h,c=r.c,pn=i=>a.day.players[i];
  if(h.type==='ramsch')return {txt:'Ramsch · '+(c.open?'läuft':c.text),all:'ramsch '+(c.text||'')+(c.jf?' jungfrau':'')+(h.durchmarsch!=null&&h.durchmarsch!==''?' durchmarsch':'')+(h.passe?' alle gepasst':'')+(h.veto?' veto':'')};
  const lost=(c.pts[h.declarer]||0)>0;
  const st=STAGEN[stageOf(h)];
  const txt=TYPES[h.type].n+' · '+pn(h.declarer)+' · '+(c.open?'läuft':(lost?'verloren':'gewonnen'))+(c.open?'':' · Wert '+c.value)+(h.reiz?' · gereizt '+h.reiz:'')+(st?' · '+st:'');
  const all=txt+' '+(h.hand?'hand ':'')+(h.ouvert?'ouvert ':'')+(h.schnAng?'schneider angesagt ':'')+(h.schwarzAng?'schwarz angesagt ':'')+(h.veto?'veto ':'')+(h.malPlayer!=null&&h.malPlayer!==''?'malenko ':'')+(r.lv>0?'bock ':'')+(h.contra||[]).map(pn).join(' ')+' '+(h.augenSp!=null?h.augenSp+' augen':'');
  return {txt,all};
}
function openSearch(q){
  if(q!==undefined)SEARCHQ=q;
  const terms=SEARCHQ.toLowerCase().split(/\s+/).filter(Boolean);
  let out='';
  if(terms.length){
    const helpHits=HELP.filter(s=>matchTerms(s.t+' '+plainText(s.h),terms));
    out+=`<h3>Hilfe und Regeln (${helpHits.length})</h3>`+(helpHits.map(s=>`<div class="hit" onclick="openHelp('${s.id}',SEARCHQ)">${s.t}</div>`).join('')||'<div class="muted">–</div>');
    const days=daysOf('all',true).slice().reverse(); // alle Saisons, laufender Spieltag und neueste zuerst
    const dayHits=[],handHits=[];let more=0;
    days.forEach(d=>{
      const label=(d.current?'laufender Spieltag ':'Spieltag ')+fmtDate(d.date)+' '+seasonName(d.season??S.season.id)+' '+d.players.join(' ');
      if(matchTerms(label,terms))dayHits.push({d,label});
      if(terms.join('').length>=2){
        const a=analyze(d);
        a.R.rows.forEach(r=>{
          const hs=handSummary(a,r);
          if(matchTerms(hs.all+' spiel '+(r.i+1)+' '+fmtDate(d.date)+' '+seasonName(d.season??S.season.id),terms)){
            if(handHits.length<60)handHits.push({d,r,hs});else more++;
          }
        });
      }
    });
    out+=`<h3>Spieltage (${dayHits.length})</h3>`+(dayHits.slice(0,30).map(x=>`<div class="hit" onclick="openStats('${x.d.current?'cur':'d'+x.d.id}')">${x.d.current?'Laufender Spieltag':'Spieltag '+fmtDate(x.d.date)} · ${esc(seasonName(x.d.season??S.season.id))} · ${esc(x.d.players.join(', '))} · ${x.d.hands.length} Spiele</div>`).join('')||'<div class="muted">–</div>');
    out+=`<h3>Spiele (${handHits.length}${more?'+':''})</h3>`+(handHits.map(x=>`<div class="hit" onclick="${x.d.current?`closeModal();openForm(${x.r.i})`:`openStats('d${x.d.id}')`}"><span class="muted">${x.d.current?'laufend':fmtDate(x.d.date)} · Spiel ${x.r.i+1}</span><br>${esc(x.hs.txt)}</div>`).join('')||'<div class="muted">–</div>')+(more?`<div class="muted">… ${more} weitere Treffer, bitte genauer suchen.</div>`:'');
  }else out='<p class="muted">Suche nach Spielern, Spielarten, Datum, Saison, Regeln … z. B. „Grand Karsten“, „verloren Kontra“, „Malenko“, „Jungfrau“, „2026“.</p>';
  showSheet(`<h1>Suche</h1><input type="text" id="searchIn" placeholder="Suchbegriff …" value="${esc(SEARCHQ)}" oninput="openSearch(this.value)">${out}
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn sec" onclick="openHelp()">❓ Hilfe</button><button class="btn sec" onclick="closeModal()">Schließen</button></div>`);
  const el=document.getElementById('searchIn');if(el){el.focus();const v=el.value;el.value='';el.value=v}
}

lastSnap=JSON.stringify(S);
applyFavicon();
if(location.hash==='#demo62'){HOME=false;fillDemo(62);history.replaceState(null,'',location.pathname)}
if(location.hash==='#demoSaisons'){HOME=false;fillDemoSeasons(13,100);history.replaceState(null,'',location.pathname)}
render();
</script>
